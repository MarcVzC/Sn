<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>ABISAL</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<script src="abisal-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Outfit:wght@400;500;600&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{--void:#070417;--cyan:#5BE9FF;--lime:#C6FF4A;--gold:#FFC93D;--mag:#FF4D9D;
  --ink:#F2EEFF;--mute:rgba(242,238,255,.5);--line:rgba(160,130,255,.16);--nav:76px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--void);color:var(--ink);overflow:hidden;
  font-family:Outfit,system-ui,sans-serif;-webkit-user-select:none;user-select:none}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
#frame{position:fixed;inset:0;z-index:50;border:0;width:100%;height:100%;display:none;background:#000}
#frame.on{display:block}
.page{position:fixed;inset:0;z-index:2;display:none;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + var(--nav) + 14px)}
.page.on{display:flex}
.page.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
.ph{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.ph h1{font:700 25px Chakra Petch}
.ph span{font:600 9px Outfit;letter-spacing:.26em;text-transform:uppercase;color:var(--mute)}
.psub{font:400 12.5px Outfit;color:var(--mute);margin-bottom:14px}
.top{display:flex;gap:8px;align-items:center}
.chip{display:flex;align-items:center;gap:6px;padding:7px 13px;background:rgba(24,14,58,.62);
  border:1px solid var(--line);border-radius:999px;font:700 13px JetBrains Mono,monospace}
.chip.g{color:var(--gold)}.chip.s{color:var(--cyan)}
.spacer{flex:1}
.ico{width:36px;height:36px;border-radius:12px;background:rgba(24,14,58,.62);
  border:1px solid var(--line);display:grid;place-items:center;font-size:15px;margin-left:6px}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.eyebrow{font:600 11px Outfit;letter-spacing:.44em;text-transform:uppercase;color:var(--mute);margin-bottom:12px}
.title{font:700 clamp(52px,18vw,84px)/.86 Chakra Petch;letter-spacing:-.03em;
  background:linear-gradient(174deg,#fff 6%,var(--cyan) 42%,var(--mag) 96%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px rgba(91,233,255,.34))}
.rule{width:52px;height:2px;margin:18px 0 12px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--cyan),var(--mag),transparent)}
.best{font:400 12.5px Outfit;color:var(--mute)}
.best b{font:700 23px JetBrains Mono,monospace;color:var(--ink)}
.play{margin-top:24px;width:min(300px,86vw);padding:19px;border:0;border-radius:20px;
  font:700 21px Chakra Petch;letter-spacing:.15em;color:#12062A;
  background:linear-gradient(96deg,var(--lime),var(--cyan) 52%,#7FD4FF);
  box-shadow:0 12px 34px -8px rgba(91,233,255,.6)}
.play:active{transform:scale(.975)}
.streak{margin-top:12px;font:500 12px Outfit;color:var(--mute)}.streak b{color:var(--gold)}
.nav{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:6;
  display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:7px;
  background:rgba(18,10,50,.74);border:1px solid var(--line);border-radius:22px}
.nav button{background:0;border:0;color:var(--mute);padding:8px 1px 6px;border-radius:14px;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  font:600 8.5px Outfit;letter-spacing:.05em;text-transform:uppercase}
.nav button b{font-size:18px;line-height:1;font-weight:400}
.nav button.on{color:var(--ink);background:rgba(91,233,255,.12)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.stat{padding:14px;border-radius:15px;background:rgba(255,255,255,.045);border:1px solid var(--line)}
.stat .v{font:700 22px JetBrains Mono,monospace;color:var(--cyan)}
.stat .k{font:500 10.5px Outfit;color:var(--mute);margin-top:3px}
.big1{padding:18px;border-radius:18px;margin-bottom:12px;text-align:center;
  background:linear-gradient(135deg,rgba(198,255,74,.12),rgba(91,233,255,.09));
  border:1px solid rgba(198,255,74,.28)}
.big1 .v{font:700 40px JetBrains Mono,monospace;color:var(--lime);line-height:1}
.big1 .k{font:600 9px Outfit;letter-spacing:.28em;text-transform:uppercase;color:var(--mute);margin-top:6px}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:13px;
  background:rgba(255,255,255,.045);border:1px solid var(--line);font:500 12.5px Outfit}
.row .rk{width:20px;font:700 12px JetBrains Mono,monospace;color:var(--mute);text-align:center}
.row .rk.p1{color:var(--gold)}.row .rk.p2{color:#D8DEF0}.row .rk.p3{color:#E09A5A}
.row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sc{font:700 12px JetBrains Mono,monospace;color:var(--cyan);min-width:42px;text-align:right}
.row .pz{font:700 12px JetBrains Mono,monospace;color:var(--gold);min-width:46px;text-align:right}
.row.me{background:rgba(91,233,255,.11);border-color:rgba(91,233,255,.34)}
.row .tk{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;
  font-size:14px;background:rgba(255,255,255,.06);flex:none}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font:600 12.5px Outfit;margin-bottom:1px}
.row .tx i{font-style:normal;font:400 10.5px Outfit;color:var(--mute)}
.row .go{padding:7px 13px;border:0;border-radius:10px;font:700 9px Chakra Petch;
  background:linear-gradient(96deg,var(--gold),#FF7A4D);color:#20120A}
.row .go.done{background:rgba(198,255,74,.18);color:var(--lime)}
.row .go.wait{background:rgba(255,255,255,.1);color:var(--mute)}
.row .go.cl{background:linear-gradient(96deg,var(--lime),var(--cyan));color:#0A1220}
.agtask+.agtask{margin-top:6px}
.pot{padding:15px;border-radius:17px;margin-bottom:12px;
  background:linear-gradient(135deg,rgba(255,201,61,.15),rgba(255,77,157,.1));
  border:1px solid rgba(255,201,61,.3)}
.pot .amt{font:700 30px JetBrains Mono,monospace;color:var(--gold);line-height:1}
.pot .lb{font:500 11px Outfit;color:var(--mute);margin-top:5px}
.bar{height:8px;border-radius:8px;background:rgba(0,0,0,.42);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--gold),var(--mag))}
.pct{display:flex;justify-content:space-between;font:600 10.5px JetBrains Mono,monospace;
  color:var(--mute);margin-top:7px}
.tabs{display:flex;gap:7px;margin-bottom:13px}
.tabs button{flex:1;padding:9px 0;border:1px solid var(--line);border-radius:12px;
  background:rgba(255,255,255,.04);color:var(--mute);font:600 10px Outfit;letter-spacing:.08em;
  text-transform:uppercase}
.tabs button.on{color:var(--ink);background:rgba(91,233,255,.14);border-color:rgba(91,233,255,.4)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.card{padding:11px 7px;border-radius:15px;border:1px solid var(--line);text-align:center;
  background:rgba(255,255,255,.04)}
.card canvas{width:100%;height:42px;display:block;margin-bottom:5px}
.card b{display:block;font:700 21px Chakra Petch;margin-bottom:2px}
.card .nm2{font:600 10px Outfit;margin-bottom:1px}
.card i{font-style:normal;display:block;font:600 8.5px Outfit;color:var(--mute);margin-bottom:7px}
.card button{width:100%;padding:6px 0;border:0;border-radius:9px;font:700 8.5px Chakra Petch;
  background:rgba(255,255,255,.1);color:var(--ink);margin-bottom:3px}
.card button.ad{background:linear-gradient(96deg,var(--gold),#FF7A4D);color:#20120A}
.card button.stb{background:linear-gradient(96deg,#7FD4FF,var(--cyan));color:#0A1220}
.card button.cb{background:linear-gradient(96deg,#FFD24A,#FFA83D);color:#20120A}
.card button.own{background:rgba(198,255,74,.18);color:var(--lime);border:1px solid rgba(198,255,74,.4)}
.cta{width:100%;margin-top:12px;padding:14px;border:0;border-radius:15px;
  font:700 13px Chakra Petch;letter-spacing:.13em;color:#12062A;
  background:linear-gradient(96deg,var(--lime),var(--cyan))}
.cta.gh{background:rgba(255,255,255,.07);color:var(--ink);border:1px solid var(--line);margin-top:8px}
.agtask{--adsgram-task-font-size:14px;--adsgram-task-icon-size:38px;
  --adsgram-task-icon-title-gap:11px;--adsgram-task-button-width:64px;
  --adsgram-task-icon-border-radius:10px;
  display:block;width:100%;padding:10px 12px;border-radius:13px;
  background:rgba(255,255,255,.045);border:1px solid var(--line);
  font-family:Outfit,system-ui,sans-serif;color:var(--ink)}
.agr{margin:4px 0 0;font:600 11px Outfit;color:var(--gold)}
.agb{margin-left:8px;padding:7px 12px;border-radius:10px;font:700 9px Chakra Petch;
  background:linear-gradient(96deg,var(--gold),#FF7A4D);color:#20120A;text-align:center}
.agc{margin-left:0;background:linear-gradient(96deg,var(--lime),var(--cyan));color:#0A1220}
.agd{margin-left:0;background:rgba(198,255,74,.18);color:var(--lime)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + var(--nav) + 22px);
  transform:translateX(-50%) translateY(14px);z-index:70;padding:11px 18px;border-radius:13px;
  background:rgba(14,20,44,.96);border:1px solid var(--line);font:600 12px Outfit;
  opacity:0;pointer-events:none;transition:.24s;max-width:86vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.over{position:fixed;inset:0;z-index:60;background:rgba(4,6,16,.96);display:none;
  flex-direction:column;align-items:center;justify-content:center;padding:24px}
.over.on{display:flex}
.over .kl{font:600 9.5px Outfit;letter-spacing:.28em;text-transform:uppercase;color:var(--mute)}
.over .who{font:700 25px Chakra Petch;margin:2px 0 14px}
.over .big{font:700 56px JetBrains Mono,monospace;color:#7FEFFF;line-height:.9;text-align:center}
.over .big small{display:block;font:600 9.5px Outfit;letter-spacing:.28em;color:var(--mute);margin-top:8px}
.over .x2{font:700 11px Chakra Petch;letter-spacing:.2em;color:var(--gold);margin-top:8px;display:none}
.over .st{display:flex;gap:19px;margin:16px 0 18px}
.over .st div{text-align:center}
.over .st b{display:block;font:700 17px JetBrains Mono,monospace;color:var(--lime)}
.over .st span{font:500 8px Outfit;letter-spacing:.13em;text-transform:uppercase;opacity:.45}
.over button#oAgain{padding:18px;font-size:17px;margin-top:10px}
.over button{width:min(300px,84vw);padding:14px;border:0;border-radius:15px;margin-top:7px;
  font:700 14px Chakra Petch;letter-spacing:.12em;color:#0A1220;
  background:linear-gradient(96deg,var(--lime),var(--cyan))}
.over button.ad{background:linear-gradient(96deg,var(--gold),#FF7A4D);color:#20120A}
.chip.lv{background:rgba(198,255,74,.12);color:var(--lime);cursor:pointer;position:relative}
.chip.lv .lvb{position:absolute;left:6px;right:6px;bottom:3px;height:2px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden}
.chip.lv .lvb span{display:block;height:100%;background:var(--lime)}
.dbtn{margin-top:10px;width:min(300px,84vw);padding:12px;border:0;border-radius:14px;
  background:linear-gradient(96deg,var(--gold),#FF7A4D);color:#20120A;font-weight:800;font-size:14px;cursor:pointer}
.dbtn.got{background:rgba(255,255,255,.08);color:var(--ink);opacity:.6}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 4px}
.dcell{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;
  padding:10px 4px;text-align:center}
.dcell .dd{font-size:10px;opacity:.6}
.dcell .dv{font-size:15px;font-weight:800;color:var(--gold);margin-top:3px}
.dcell.done{background:rgba(198,255,74,.10);border-color:var(--lime)}
.dcell.done .dv{color:var(--lime)}
.dcell.now{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,196,74,.25)}
.dcell.big{grid-column:span 4}
.dclaim{width:min(300px,84vw);padding:16px;border:0;border-radius:15px;margin:6px auto;display:block;
  background:linear-gradient(96deg,var(--gold),#FF7A4D);color:#20120A;font-weight:800;font-size:16px;cursor:pointer}
.dclaim:disabled{background:rgba(255,255,255,.08);color:var(--ink);opacity:.5}
.dnote{font-size:12px;opacity:.7;text-align:center;margin:8px 12px}
#pLvlBar{height:6px;background:rgba(255,255,255,.08);border-radius:4px;margin:8px 0 4px;overflow:hidden}
#pLvlBar span{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--gold));border-radius:4px}
#pLvlTxt{font-size:11px;opacity:.7;text-align:center;margin-bottom:6px}
#taskList .mbar{height:4px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:5px;overflow:hidden}
#taskList .mbar span{display:block;height:100%;background:linear-gradient(90deg,var(--lime),var(--gold));border-radius:3px}
.over .orank{font-size:13px;color:var(--ink);opacity:.9;margin:6px 0 2px;text-align:center}
.over .orank b{color:var(--gold)}
.over .onear{font-size:12px;color:var(--lime);margin-bottom:4px;text-align:center;min-height:14px}
.over .otip{font-size:11px;line-height:1.35;color:var(--ink);opacity:.6;margin:6px 6px 8px;
  text-align:center;border-top:1px solid var(--line);padding-top:6px}
.over .otip:empty{display:none;border:0;margin:0;padding:0}
.over .onear:empty{display:none}
.over button.gh{background:rgba(255,255,255,.08);color:var(--ink);border:1px solid var(--line)}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<iframe id="frame" src="abisal-game.html" allow="autoplay"></iframe>

<div class="page on" id="pHome">
  <div class="top">
    <div class="chip lv" id="cLvlChip">⬢ <span id="cLvl">1</span></div>
    <div class="chip g">◈ <span id="cCoins">0</span></div>
    <div class="chip s">★ <span id="cStars">0</span></div>
    <div class="spacer"></div>
    <div class="ico" id="bProf">👤</div>
    <div class="ico" id="bSet">⚙</div>
  </div>
  <div class="hero">
    <div class="eyebrow" id="tEyebrow">Arcade</div>
    <div class="title">ABISAL</div>
    <div class="rule"></div>
    <div class="best"><span id="tBest">Mejor puntuación</span> <b id="cBest">0</b></div>
    <button class="play" id="bPlay">JUGAR</button>
    <div class="streak" id="cStreakBox"></div>
    <button class="dbtn" id="bDaily"></button>
  </div>
</div>

<div class="page scroll" id="pDaily">
  <div class="ph"><h1 id="hDaily">Recompensa diaria</h1><span class="ico" id="bDailyBack" style="cursor:pointer">✕</span></div>
  <div class="psub" id="subDaily"></div>
  <div class="dgrid" id="dGrid"></div>
  <button class="dclaim" id="bClaim"></button>
  <div class="dnote" id="dNote"></div>
</div>

<div class="page scroll" id="pProfile">
  <div class="ph"><h1 id="hProfile">Perfil</h1><span id="sProfile"></span></div>
  <div class="psub" id="subProfile"></div>
  <div id="pLvlBar"></div>
  <div id="pLvlTxt"></div>
  <div class="big1"><div class="v" id="pTotal">0</div><div class="k" id="lTotal">PUNTOS TOTALES</div></div>
  <div class="stats" id="profStats"></div>
  <div class="rows" id="profExtra"></div>
</div>

<div class="page scroll" id="pSet">
  <div class="ph"><h1 id="hSet">Ajustes</h1></div>
  <div class="rows" id="setBody"></div>
</div>

<div class="page scroll" id="pShop">
  <div class="ph"><h1 id="hShop">Tienda</h1></div>
  <div class="tabs">
    <button data-t="cons" class="on" id="tabCons">Objetos</button>
    <button data-t="skin" id="tabSkin">Skins</button>
    <button data-t="fondo" id="tabFondo">Fondos</button>
  </div>
  <div id="shopBody"></div>
</div>

<div class="page scroll" id="pTasks">
  <div class="ph"><h1 id="hTasks">Tareas</h1></div>
  <div class="psub" id="subTasks"></div>
  <div class="rows" id="taskList"></div>
</div>

<div class="page scroll" id="pRank">
  <div class="ph"><h1 id="hRank">Ranking</h1></div>
  <div class="tabs">
    <button data-r="hab" class="on" id="tabHab">Mejores</button>
    <button data-r="red" id="tabRed">Reclutadores</button>
    <button data-r="clan" id="tabClan">Clanes</button>
  </div>
  <div id="rankBody"></div>
</div>

<div class="page scroll" id="pFriends">
  <div class="ph"><h1 id="hFriends">Amigos</h1></div>
  <div class="psub" id="subFriends"></div>
  <div class="stats" id="frStats"></div>
  <div class="rows" id="frList"></div>
  <button class="cta" id="bInvite"></button>
  <button class="cta gh" id="bCopy"></button>
</div>

<nav class="nav" id="nav">
  <button data-p="pHome" class="on"><b>◈</b><span data-l="0">Jugar</span></button>
  <button data-p="pShop"><b>🎒</b><span data-l="1">Tienda</span></button>
  <button data-p="pTasks"><b>✓</b><span data-l="4">Tareas</span></button>
  <button data-p="pRank"><b>🏆</b><span data-l="2">Ranking</span></button>
  <button data-p="pFriends"><b>🔗</b><span data-l="3">Amigos</span></button>
</nav>

<div class="toast" id="toast"></div>

<div class="over" id="over">
  <div id="oKill" style="display:none;text-align:center">
    <div class="kl" id="oKl"></div><div class="who" id="oWho"></div></div>
  <div class="big"><span id="oPts">0</span><small id="oPtsL">PUNTOS</small></div>
  <div class="x2" id="oX2"></div>
  <div class="st">
    <div><b id="oLen">0</b><span data-s="sLen">largo</span></div>
    <div><b id="oLvl">1</b><span data-s="sLvl">nivel</span></div>
    <div><b id="oTm">0:00</b><span data-s="sTm">tiempo</span></div>
    <div><b id="oK">0</b><span data-s="sK">bajas</span></div>
  </div>
  <div class="orank" id="oRank"></div>
  <div class="onear" id="oNear"></div>
  <div class="otip" id="oTip"></div>
  <button class="gh" id="oShare" style="display:none"></button>
  <button class="ad" id="oBX2"></button>
  <button class="ad" id="oBRev"></button>
  <button id="oAgain"></button>
  <button class="gh" id="oMenu"></button>
</div>

<script>
var CFG=window.ABISAL_CFG||{};
var TG=(window.Telegram&&window.Telegram.WebApp)||null;
var TGU=(TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user)||null;
var REF=(function(){
  var v='';
  try{if(TG&&TG.initDataUnsafe&&TG.initDataUnsafe.start_param)v=TG.initDataUnsafe.start_param}catch(e){}
  if(!v){try{var q=new URLSearchParams(location.search);
    v=q.get('tgWebAppStartParam')||q.get('startapp')||q.get('ref')||''}catch(e){}}
  v=String(v).replace('ref_','').trim();
  return /^\d+$/.test(v)?v:''})();
var AD_DAILY=(CFG.LIMITS&&CFG.LIMITS.adsPerDay)||12;
var PR=CFG.PRICES||{clanCreate:2500,clanRename:800,userRename:0};
var POT=CFG.POT||{usd:100,raised:0,deadline:null};

var LG=(function(){
  if(TGU&&TGU.language_code)return TGU.language_code.toLowerCase().indexOf('es')===0?'es':'en';
  return (navigator.language||'en').toLowerCase().indexOf('es')===0?'es':'en'})();

var DICT={
es:{nav:['Jugar','Tienda','Ranking','Amigos','Tareas'],arcade:'Arcade',bestScore:'Mejor puntuación',
 play:'JUGAR',streak:function(n){return 'Racha de <b>'+n+'</b> día'+(n>1?'s':'')},
 dReward:'🎁 RECOMPENSA DIARIA',dTitle:'Recompensa diaria',
 dSub:'Vuelve cada día: la recompensa sube. Si faltas un día bajas un escalón, no vuelves a cero.',
 dClaim:'RECLAMAR',dGot:'Reclamado hoy · vuelve mañana',dDay:'Día',
 dOk:function(c,p){return '+'+c+' ◈'+(p?' y +'+p+' pts':'')},
 dBonus:'+250 pts al ranking',

function saveLocal(){

    var o=JSON.parse(r);
    return (o&&typeof o==='object'&&!Array.isArray(o))?o:null}catch(e){return null}}
// escapa cualquier texto que venga del servidor o de localStorage antes de meterlo en HTML
function esc(v){
  return String(v==null?'':v).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
// numero seguro: descarta NaN/Infinity/negativos absurdos
function num(v,def){
  var n=Number(v);
  return (isFinite(n)&&n>=0&&n<1e12)?n:(def||0)}

function applyServer(r){
  if(!r)return;
  if(typeof r.coins==='number')S.coins=num(r.coins,S.coins);
  if(r.inv)S.inv=r.inv;
  if(r.skins)S.skins=r.skins.slice(0);
  if(r.fondos)S.fondos=r.fondos.slice(0);
  if(r.skin)S.skin=r.skin;
  if(r.fondo)S.fondo=r.fondo;
  if(r.player){var p=r.player;
    // num() evita que un valor raro (NaN, negativo, absurdo) corrompa la UI
    S.best=num(p.best_pts,S.best)||S.best;S.totalPts=num(p.total_pts,S.totalPts)||S.totalPts;
    S.bestLen=num(p.best_len,S.bestLen)||S.bestLen;S.runs=num(p.runs,S.runs)||S.runs;
    S.kills=num(p.kills,S.kills)||S.kills;S.wins=num(p.wins,S.wins)||S.wins;
    S.streak=num(p.streak,S.streak)||S.streak;S.netPts=num(p.net_pts,S.netPts)||S.netPts;
    if(typeof p.coins==='number')S.coins=num(p.coins,S.coins)}
  saveLocal();refresh()}
function api(path,body){
  if(!CFG.API_BASE)return Promise.resolve(null);
  var b=body||{};b.initData=TG?TG.initData:'';
  if(REF)b.ref=REF;
  return fetch(CFG.API_BASE+'/'+path,{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})
    .then(function(r){return r.json()}).catch(function(){return null})}

var AdCtl=null;
// el SDK de AdsGram puede tardar en cargar; esperarlo antes de rendirse
function adsSdkReady(){return !!(window.Adsgram&&typeof window.Adsgram.init==='function')}
function inMiniApp(){try{return !!(TG&&TG.initData&&TG.initData.length>0)}catch(e){return false}}
function waitAdsSdk(cb){
  if(adsSdkReady())return cb(true);
  var n=0,t=setInterval(function(){
    if(adsSdkReady()){clearInterval(t);cb(true);return}
    if(++n>=20){clearInterval(t);cb(false)}   // 20 x 250ms = ~5s
  },250)}
function showAd(ok){
  // distinguir "ads apagados" / "SDK no listo" / "fuera de Mini App"
  if(!CFG.ADSGRAM_ENABLED)return toast(L.adNoSdk);
  var id=rewardId();
  if(!id)return toast(L.adNoSdk);
  if(adsSdkReady())return runAd(id,ok);
  if(!inMiniApp())return toast(L.adNoTg);
  toast(L.adLoad);
  waitAdsSdk(function(ready){
    if(!ready)return toast(L.adNotReady);
    runAd(id,ok)})}
function runAd(id,ok){
  try{
    if(!AdCtl){
      AdCtl=window.Adsgram.init({blockId:id});
      AdCtl.addEventListener('onBannerNotFound',function(){toast(L.adNone)});
      AdCtl.addEventListener('onNonStopShow',function(){toast(L.adBusy)});
      AdCtl.addEventListener('onTooLongSession',function(){toast(L.adRestart)});
    }
    toast(L.adLoad);
    AdCtl.show().then(function(res){
      if(res&&res.done===false)return;
      ok();
    }).catch(function(res){
      var d=(res&&res.description)||'';
      if(/BannerNotFound/i.test(d))toast(L.adNone);
      else if(/NonStopShow/i.test(d))toast(L.adBusy);
      else if(/TooLongSession/i.test(d))toast(L.adRestart);
      else toast(L.adFail)});
  }catch(e){toast(L.adFail)}}

function payStars(item,amount,ok){
  if(!TG||!TG.openInvoice||!CFG.API_BASE)return toast(L.payUnavailable);

function sendStart(){
  toFrame({type:'abisal:start',
    payload:{inv:S.inv,skin:S.skin,fondo:S.fondo,coins:0,
     sfx:S.sfx,music:S.music,lang:S.lang,name:S.name}})}
function play(){
  revived=false;bgOn=false;frame.classList.add('on');
  x2Base=0;                       // la base de monedas del motor arranca en 0 en cada partida
  cnt={any:false,pts:0,coins:0,kills:0,time:0,won:false};
  // el motor solo arranca cuando ha confirmado abisal:ready: si no, su canvas
  // puede no tener tamano todavia y se veria la caverna en negro
  if(gameReady){sendStart();return}
  wantStart=true;
  var n=0,t=setInterval(function(){
    if(gameReady){clearInterval(t);if(wantStart){wantStart=false;sendStart()}return}
    if(++n>=25){                  // ~5s sin respuesta: aviso y recarga limpia del iframe
      clearInterval(t);toast(L.gameSlow);
      try{frame.contentWindow.location.reload()}catch(err){frame.src=frame.src}}
  },200)}
var MSGOK={'abisal:ready':1,'abisal:coins':1,'abisal:over':1};
addEventListener('message',function(e){
  // solo mensajes del iframe del motor, del mismo origen y con forma conocida
  if(e.source!==frame.contentWindow)return;
  if(e.origin&&e.origin!=='null'&&e.origin!==location.origin)return;
  var m=e.data;
  if(!m||typeof m!=='object'||typeof m.type!=='string'||!MSGOK[m.type])return;
  if(m.payload!=null&&typeof m.payload!=='object')return;
  if(m.type==='abisal:ready'){gameReady=true;
    if(wantStart){wantStart=false;sendStart()}   // arranque pendiente tras recargar el iframe
    return}
  if(m.type==='abisal:coins'){
    var c=(m.payload&&m.payload.coins)||0;
    if(c>x2Base){S.coins+=(c-x2Base);x2Base=c;refresh();saveLocal()}
    return}
  if(m.type!=='abisal:over')return;
  var d=m.payload||{};
  // tras revivir llega un segundo 'over' con los totales de la MISMA partida:
  // se contabiliza solo la diferencia para no duplicar puntos, monedas ni runs
  S.coins+=Math.max(0,(d.coins||0)-cnt.coins);
  var recAntes=S.best||0;              // record previo, para el aviso de "casi lo tienes"
  if(!cnt.any)S.runs++;
  S.kills+=Math.max(0,(d.kills||0)-cnt.kills);
  var dPts=Math.max(0,(d.pts||0)-cnt.pts);
  S.totalPts+=dPts;S.cyclePts+=dPts;S.best=Math.max(S.best,d.pts||0);
  S.bestLen=Math.max(S.bestLen,d.len||0);
  S.bestTime=Math.max(S.bestTime,d.time||0);
  S.totalTime+=Math.max(0,(d.time||0)-cnt.time);
  if(d.inv)S.inv=d.inv;if(d.won&&!cnt.won)S.wins++;
  if(d.nemesis){S.nemesis=d.nemesis;S.nemCnt=d.nemCnt}
  $('oPts').textContent=d.pts||0;$('oPtsL').textContent=L.pts;
  $('oLen').textContent=d.len||0;$('oLvl').textContent=d.lvl||1;
  $('oTm').textContent=Math.floor((d.time||0)/60)+':'+String((d.time||0)%60).padStart(2,'0');
  $('oK').textContent=d.kills||0;
  $('oKill').style.display=(d.killer||d.won)?'block':'none';
  $('oKl').textContent=d.won?L.survived:L.killedBy;
  $('oWho').textContent=d.won?L.survivor:(d.killer||'');
  $('oWho').style.color=d.won?'var(--lime)':'#FF5C7A';
  pintaFin(d,recAntes);

  $('oBX2').style.display=d.canX2?'block':'none';
  $('oBRev').style.display=(d.canRevive&&!revived)?'block':'none';
  $('over').classList.add('on');refresh();
  missionProgress(d,cnt.any);
  cnt={any:true,pts:d.pts||0,coins:d.coins||0,kills:d.kills||0,time:d.time||0,won:!!d.won};
  x2Base=d.coins||0;   // ya acreditadas: del 'abisal:coins' del x2 solo se suma el extra
  // no enviar el run todavia: el usuario aun puede hacer x2 o revivir
  pendingRun={pts:d.pts||0,len:d.len||0,lvl:d.lvl||1,secs:d.time||0,
    kills:d.kills||0,inv:S.inv,won:!!d.won};   // 'won' distingue el bono de victoria en el servidor
  armPendTimer();
  saveLocal()});

// ── pantalla de fin: puesto, cercania al record y un consejo util ──
function puestoEstimado(pts){
  // se calcula con la tabla que ya tenemos descargada: se ve al instante y se
  // corrige sola en la siguiente sincronizacion. El puesto cambia igual aunque
  // no miremos, asi que mostrarlo al momento no engana a nadie.
  var tabla=BOARDS.hab&&BOARDS.hab.length?BOARDS.hab:[];
  if(!tabla.length)return null;
  var mios=S.cyclePts||0,mejores=0;
  for(var i=0;i<tabla.length;i++)if((tabla[i][1]||0)>mios)mejores++;
  var corte=tabla.length>=20?(tabla[19][1]||0):null;
  return {pos:mejores+1,total:Math.max(tabla.length,mejores+1),corte:corte};
}
function consejoFin(d){
  // uno solo, corto, y solo cuando aporta: en partidas largas y con bajas el
  // jugador ya sabe jugar y el texto solo satura la pantalla.
  var t=L.tips||[];
  if(!t.length)return '';
  if((d.time||0)>=90&&(d.kills||0)>=1)return '';
  var i;
  if((d.time||0)<20)      i=0;                       // murio pronto: como se mata
  else if(!d.kills)       i=7;                       // sin bajas: valen 60 pts
  else if((d.lvl||1)<2)   i=6;                       // no subio de nivel
  else if(d.killer)       i=[1,2,3,4][(S.runs||0)%4];// murio matado: consumibles y bordes
  else                    i=[5,8,9][(S.runs||0)%3];
  var pre=((d.time||0)<20&&d.killer)?L.tipKill:L.tipGen;
  return '<b>'+pre+'</b> '+t[i%t.length];
}
function pintaFin(d,recAntes){
  var pts=d.pts||0;
  // puesto
  var q=puestoEstimado(pts),rk=$('oRank');
  if(!q){ rk.innerHTML=L.rkPrim; }
  else if(q.corte!==null&&(S.cyclePts||0)<q.corte){
    rk.innerHTML=L.rkPos+' <b>#'+q.pos+'</b> '+L.rkDe+' '+q.total+
      ' · '+L.rkFalta+' <b>'+(q.corte-(S.cyclePts||0))+'</b> '+L.rkPts;
  } else {
    rk.innerHTML=L.rkPos+' <b>#'+q.pos+'</b> '+L.rkDe+' '+q.total+' · '+L.rkTop;
  }
  // cercania al record
  var nr=$('oNear');
  if(pts>recAntes&&recAntes>0)      nr.innerHTML='🏅 '+L.nearNew;
  else if(recAntes-pts>0&&recAntes-pts<=Math.max(40,recAntes*0.15))
    nr.innerHTML=L.nearFalt+' <b>'+(recAntes-pts)+'</b>';
  else nr.innerHTML='';
  // consejo
  $('oTip').innerHTML=consejoFin(d);
}

// envio diferido del run (tras x2 / volver al menu / jugar otra vez / timeout)
var pendingRun=null,pendTimer=null;
function armPendTimer(){
  if(pendTimer)clearTimeout(pendTimer);
  pendTimer=setTimeout(function(){sendPendingRun()},100000)} // red de seguridad ~100s
function clearPendingRun(){
  if(pendTimer){clearTimeout(pendTimer);pendTimer=null}
  pendingRun=null}
function sendPendingRun(){
  if(pendTimer){clearTimeout(pendTimer);pendTimer=null}
  var run=pendingRun;pendingRun=null;
  if(!run)return;
  run.inv=S.inv;
  if(SESSION){run.session=SESSION;SESSION=null;
    api('run',run).then(function(r){
      if(!r){pushPend(run);return}
      if(r.ok===false){toast(L.runReject);return}
      applyServer(r)})}
  else pushPend(run)}
// si el usuario sale de la app con el overlay abierto, no se pierde la partida
addEventListener('visibilitychange',function(){
  if(document.visibilityState==='hidden'&&pendingRun)sendPendingRun()});
addEventListener('pagehide',function(){
  if(pendingRun){pushPend(pendingRun);clearPendingRun()}});
function pushPend(r){
  if(!S.pendRuns)S.pendRuns=[];
  if(S.pendRuns.length<20)S.pendRuns.push(r);saveLocal()}
function flushPend(){
  if(!S.pendRuns||!S.pendRuns.length||!CFG.API_BASE)return;
  var list=S.pendRuns.slice(0);S.pendRuns=[];saveLocal();
  (function next(){
    if(!list.length)return;
    var r=list.shift();
    api('session').then(function(sr){
      if(sr&&sr.session){r.session=sr.session;api('run',r).then(function(){next()})}
      else{pushPend(r);next()}})})()}

function skinPreview(cv,sk){
  if(!cv.clientWidth){requestAnimationFrame(function(){skinPreview(cv,sk)});return}
  var c=cv.getContext('2d'),w=cv.width=cv.clientWidth*2,h=cv.height=cv.clientHeight*2,i;
  c.clearRect(0,0,w,h);c.lineCap='round';c.lineJoin='round';
  var pts=[];
  for(i=0;i<=22;i++)pts.push([w*.14+(i/22)*w*.72,h*.5+Math.sin(i*.42)*h*.22]);
  for(var p=0;p<3;p++){
    for(i=0;i<pts.length-1;i++){
      c.strokeStyle=sk.f(i,0);c.globalAlpha=[.16,.36,1][p];
      c.lineWidth=(h*.34)*[2.2,1.4,.7][p]*(1-i*.018);
      c.beginPath();c.moveTo(pts[i][0],pts[i][1]);c.lineTo(pts[i+1][0],pts[i+1][1]);c.stroke()}}
  c.globalAlpha=1}
function fondoPreview(cv,f){
  if(!cv.clientWidth){requestAnimationFrame(function(){fondoPreview(cv,f)});return}
  var c=cv.getContext('2d'),w=cv.width=cv.clientWidth*2,h=cv.height=cv.clientHeight*2;
  c.fillStyle='rgb('+f.bg[0]+','+f.bg[1]+','+f.bg[2]+')';c.fillRect(0,0,w,h);
  for(var i=0;i<9;i++){var s=Math.abs(Math.sin(i*7.3+f.id.length));
    c.fillStyle='rgba('+((f.rock[0]*.4)|0)+','+((f.rock[1]*.4)|0)+','+((f.rock[2]*.45)|0)+',.7)';
    c.beginPath();c.arc(s*w,(i*37)%h,h*(.18+s*.3),0,6.29);c.fill()}
  var g=c.createLinearGradient(0,h*.3,w,h*.7);
  g.addColorStop(0,f.acc+'00');g.addColorStop(.5,f.acc+'99');g.addColorStop(1,f.acc+'00');
  c.strokeStyle=g;c.lineWidth=h*.16;c.lineCap='round';
  c.beginPath();c.moveTo(w*.12,h*.62);c.quadraticCurveTo(w*.5,h*.2,w*.88,h*.55);c.stroke()}

// nivel 1 = alcanzable en la primera sesion. El nivel 2 aparece al completar
// las tres del nivel 1: asi el jugador nuevo ve metas posibles, no imposibles.
function nivelMisiones(){
  var p=mp(),hechas=0,i;
  for(i=0;i<LTASKS.length;i++){
    var t=LTASKS[i];
    if(t.niv===1&&(taskState(t.id).st===2||(p[t.fld]||0)>=t.g))hechas++;
  }
  return hechas>=3?2:1;
}
function today(){return new Date().toISOString().slice(0,10)}
function mp(){
  if(!S.mp||S.mp.day!==today())S.mp={day:today(),runs:0,len:0,kills:0,time:0,open:1};
  return S.mp}
function taskState(id){
  if(!S.tasks)S.tasks={};
  var t=S.tasks[id];
  if(!t||t.day!==today()){t={day:today(),st:0};S.tasks[id]=t}
  return t}
// se llama al terminar cada partida
function missionProgress(d,same){
  var p=mp();
  if(!same)p.runs+=1;          // 'same' = mismo run tras revivir: no cuenta como partida nueva
  p.len=Math.max(p.len,d.len||0);
  p.kills=Math.max(p.kills,d.kills||0);
  p.time=Math.max(p.time,d.time||0);
  saveLocal()}
function drawTasks(){
  $('hTasks').textContent=L.tasks;$('subTasks').textContent=L.taskSub;
  var box=$('taskList'),tid=taskId(),html='',i,p=mp();
  var ready=window.customElements&&customElements.get&&customElements.get('adsgram-task');
  if(CFG.ADSGRAM_ENABLED&&tid&&ready)
    html+='<adsgram-task class="agtask" data-block-id="'+tid+'">'+
      '<p slot="reward" class="agr">+'+TASK_REWARD+' \u25C8</p>'+
      '<div slot="button" class="agb">'+L.taskGo+'</div>'+
      '<div slot="claim" class="agb agc">'+L.taskClaim+'</div>'+
      '<div slot="done" class="agb agd">'+L.taskDone+'</div>'+
      '</adsgram-task>';
  var nv=nivelMisiones();
  for(i=0;i<LTASKS.length;i++){
    var t=LTASKS[i],st=taskState(t.id),cur=p[t.fld]||0,lab,cls='';
    if((t.niv||1)>nv)continue;                       // el nivel 2 aparece al acabar el 1
    if(st.st===2){lab=L.taskDone;cls=' done'}
    else if(cur>=t.g){lab=L.taskClaim;cls=' cl'}
    else{lab=Math.min(cur,t.g)+'/'+t.g;cls=' wait'}
    var pc=Math.max(0,Math.min(100,Math.round(cur/t.g*100)));
    html+='<div class="row"><div class="tk">\u25C8</div>'+
      '<div class="tx"><b>'+L[t.k]+'</b><i>+'+t.r+' \u25C8</i>'+
      (st.st===2?'':'<div class="mbar"><span style="width:'+pc+'%"></span></div>')+'</div>'+
      '<button class="go'+cls+'" data-lt="'+t.id+'">'+lab+'</button></div>'}
  box.innerHTML=html;
  var el=box.querySelector('adsgram-task');
  if(el){
    var agAt=0;
    el.addEventListener('click',function(){if(!agAt)agAt=Date.now()},true);
    el.addEventListener('reward',function(){
      if(!agAt||Date.now()-agAt<TASK_WAIT){agAt=0;return toast(L.taskWait)}
      agAt=0;
      S.coins+=TASK_REWARD;saveLocal();
      api('ad',{kind:'task'}).then(function(r){applyServer(r)});
      toast('+'+TASK_REWARD+' \u25C8');refresh()});
    el.addEventListener('onBannerNotFound',function(){el.style.display='none'});
    el.addEventListener('onError',function(){el.style.display='none'});
    el.addEventListener('onTooLongSession',function(){toast(L.adBusy)})}
  var bs=box.querySelectorAll('[data-lt]');
  for(var j=0;j<bs.length;j++)(function(x){x.onclick=function(){
    var id=x.dataset.lt,st=taskState(id),def=null,pp=mp();
    for(var k=0;k<LTASKS.length;k++)if(LTASKS[k].id===id)def=LTASKS[k];
    if(!def||st.st===2)return;
    if((pp[def.fld]||0)<def.g)return toast(L.taskLocked);
    st.st=2;S.coins+=def.r;saveLocal();
    api('ad',{kind:'task',item:id}).then(function(r){applyServer(r)});
    toast('+'+def.r+' \u25C8');refresh();drawTasks()}})(bs[j])}
function loadTasks(){
  if(window.customElements&&customElements.whenDefined){
    customElements.whenDefined('adsgram-task').then(function(){drawTasks()})
      .catch(function(){})}
  drawTasks()}

// escalon creciente: los primeros niveles caen rapido para enganchar,
// luego cuestan mas. 800, 1800, 3000, 4400... (base 800 + 200 por nivel)
function nivelPerfil(tot){
  var n=1,acum=0,paso=800;
  while(acum+paso<=tot&&n<99){acum+=paso;n++;paso=800+(n-1)*200}
  var dentro=tot-acum,pc=Math.max(0,Math.min(100,Math.round(dentro/paso*100)));
  return {n:n,pc:pc,falta:Math.max(0,paso-dentro),paso:paso};
}
function pintaNivelChip(){
  var nv=nivelPerfil(S.totalPts||0);
  var el=$('cLvl'); if(el)el.textContent=nv.n;

  if(chip&&!chip.querySelector('.lvb'))
    chip.insertAdjacentHTML('beforeend','<div class="lvb"><span></span></div>');
  var b=chip&&chip.querySelector('.lvb span');
  if(b)b.style.width=nv.pc+'%';
}

function initLocal(){
  var o=loadLocal();if(!o)return;
  for(var i=0;i<LFIELDS.length;i++){
    var k=LFIELDS[i],v=o[k];
    if(v===undefined||v===null)continue;
    // datos corruptos no deben tumbar la UI: cada campo debe conservar su tipo
    if(typeof S[k]==='number'){S[k]=num(v,S[k]);continue}
    if(typeof S[k]==='boolean'){if(typeof v==='boolean')S[k]=v;continue}
    if(Array.isArray(S[k])){if(Array.isArray(v))S[k]=v;continue}
    S[k]=v}
  if(S.adsDay!==today()){S.adsDay=today();S.adsToday=0}
  refresh()}
var MAXF=['coins','stars','best','bestLen','bestTime','totalTime','totalPts',
 'runs','kills','wins','netPts','streak','cyclePts'];
function loadState(){
  api('state').then(function(r){
    if(!r||!r.player)return;
    var p=r.player;
    // en campos de progreso nunca bajamos: el local reciente no se pisa
    var sv={coins:p.coins||0,stars:p.stars||0,best:p.best_pts||0,bestLen:p.best_len||0,
      bestTime:p.best_time||0,totalTime:p.total_time||0,totalPts:p.total_pts||0,
      runs:p.runs||0,kills:p.kills||0,wins:p.wins||0,netPts:p.net_pts||0,
      streak:p.streak||1,cyclePts:p.cycle_pts||0,
      dailyDay:p.daily_day?String(p.daily_day).slice(0,10):null,dailyN:p.daily_n||0};
    for(var i=0;i<MAXF.length;i++){var k=MAXF[i];
      S[k]=Math.max(S[k]||0,sv[k]||0)}
    S.cyclePts=Math.max(S.cyclePts||0,p.cycle_pts||0);
    // el estado de la recompensa diaria manda el servidor, no el local
    S.dailyDay=sv.dailyDay;S.dailyN=sv.dailyN;
    // idioma unico para bot, menu y juego: el de la ficha del servidor
    if(p.lang&&(p.lang==='es'||p.lang==='en')&&p.lang!==S.lang){
      S.lang=p.lang;L=DICT[S.lang];LG=S.lang;
      applyLang();pushSettings();
    }
    S.skin=p.skin||S.skin;S.fondo=p.fondo||S.fondo;
    var ss=p.skins||[],ff=p.fondos||[];
    for(var a=0;a<ss.length;a++)addOwn(S.skins,ss[a]);
    for(var b2=0;b2<ff.length;b2++)addOwn(S.fondos,ff[b2]);
    S.inv=p.inv||S.inv;
    S.name=p.display_name||S.name;
    S.adsToday=Math.max(S.adsToday||0,r.adsToday||0);
    if(r.friends)S.friends=r.friends;
    if(typeof r.place==='number')S.place=r.place;
    if(r.doneTasks&&r.doneTasks.length){
      for(var d2=0;d2<r.doneTasks.length;d2++){
        var ts=taskState(r.doneTasks[d2]);ts.st=2}}
    if(r.cycle){POT.usd=r.cycle.usd;POT.raised=r.cycle.raised||0;POT.deadline=r.cycle.deadline}
    if(r.boards){
      BOARDS.hab=(r.boards.hab||[]).map(function(x){return [x.name,x.pts]});
      BOARDS.red=(r.boards.red||[]).map(function(x){return [x.name,x.pts]});
      BOARDS.clan=(r.boards.clans||[]).map(function(x){return [x.name,x.members,x.week_pts,x.id]})}
    S.myClan=r.myClan||null;
    S.clan=S.myClan?S.myClan.name:null;
    saveLocal();flushPend();
    refresh();drawShop();drawRank();drawProfile();drawFriends();drawTasks()})}

var bg=$('bg'),g=bg.getContext('2d',{alpha:false});
var W=0,H=0,tk=0,path=[],ang=-.6,hx=0,hy=0,layer=null,lastT=0,bgOn=true;
function buildLayer(){
  if(!W||!H){W=innerWidth||360;H=innerHeight||640}
  layer=document.createElement('canvas');
  layer.width=Math.max(2,Math.ceil(W*.5));layer.height=Math.max(2,Math.ceil(H*.5));
  var c=layer.getContext('2d'),i;
  c.fillStyle='#070417';c.fillRect(0,0,layer.width,layer.height);
  var bl=[[.24,.22,'46,26,107',.85],[.82,.3,'12,86,116',.7],[.52,.84,'92,20,84',.92]];
  for(i=0;i<bl.length;i++){
    var b=bl[i],R=Math.max(layer.width,layer.height)*b[3];
    var rg=c.createRadialGradient(b[0]*layer.width,b[1]*layer.height,0,
      b[0]*layer.width,b[1]*layer.height,R);
    rg.addColorStop(0,'rgba('+b[2]+',.55)');rg.addColorStop(1,'rgba('+b[2]+',0)');
    c.fillStyle=rg;c.fillRect(0,0,layer.width,layer.height)}
  for(i=0;i<90;i++){var z=Math.random()*.7+.3;
    c.fillStyle='hsla('+(180+Math.random()*90)+',90%,80%,'+(.14+z*.34)+')';
    c.fillRect(Math.random()*layer.width,Math.random()*layer.height,z*1.4,z*1.4)}
  var v=c.createRadialGradient(layer.width/2,layer.height/2,
    Math.min(layer.width,layer.height)*.34,layer.width/2,layer.height/2,
    Math.max(layer.width,layer.height)*.82);
  v.addColorStop(0,'rgba(7,4,23,0)');v.addColorStop(1,'rgba(7,4,23,.9)');
  c.fillStyle=v;c.fillRect(0,0,layer.width,layer.height)}
function fit(){
  var d=Math.min(devicePixelRatio||1,1.5);
  W=innerWidth||360;H=innerHeight||640;
  bg.width=Math.max(1,Math.ceil(W*d));bg.height=Math.max(1,Math.ceil(H*d));
  g.setTransform(d,0,0,d,0,0);hx=W*.5;hy=H*.5;path=[];
  for(var i=0;i<110;i++)path.push({x:hx,y:hy});buildLayer()}
addEventListener('resize',fit);fit();
function draw(now){
  requestAnimationFrame(draw);
  if(!bgOn)return;
  if(!now)now=Date.now();
  if(now-lastT<40)return;lastT=now;
  if(W!==innerWidth&&innerWidth)fit();
  if(!layer||!layer.width)buildLayer();
  tk++;
  try{
    g.drawImage(layer,0,0,W,H);
    ang+=Math.sin(tk*.022)*.032+Math.cos(tk*.0086)*.022;
    hx+=Math.cos(ang)*3;hy+=Math.sin(ang)*3;
    var m=70;
    if(hx<m||hx>W-m||hy<m||hy>H-m)ang+=Math.atan2(H/2-hy,W/2-hx)>ang?.09:-.09;
    hx=Math.max(m*.4,Math.min(W-m*.4,hx));hy=Math.max(m*.4,Math.min(H-m*.4,hy));
    path.unshift({x:hx,y:hy});if(path.length>110)path.pop();
    var sk=findBy(SKINS,S.skin)||SKINS[0];
    g.globalCompositeOperation='lighter';g.lineCap='round';g.lineJoin='round';
    for(var p=0;p<3;p++){
      g.globalAlpha=[.10,.20,.5][p];
      for(var i=0;i<path.length-1;i+=2){
        var f=i/path.length;
        g.strokeStyle=sk.f(i*.3,tk*.7);
        g.lineWidth=(13-f*9)*[2.6,1.6,.8][p];
        g.beginPath();g.moveTo(path[i].x,path[i].y);
        g.lineTo(path[i+1].x,path[i+1].y);g.stroke()}}
    g.globalAlpha=1;g.globalCompositeOperation='source-over';
  }catch(e){}}

if(TG){try{TG.ready();TG.expand();
  if(TG.setHeaderColor)TG.setHeaderColor('#070417');
  if(TG.setBackgroundColor)TG.setBackgroundColor('#070417');
  if(TG.disableVerticalSwipes)TG.disableVerticalSwipes()}catch(e){}}
applyLang();loadTasks();loadState();requestAnimationFrame(draw);
</script>
