<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>ABISAL</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Outfit:wght@500;600&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;touch-action:none;overscroll-behavior:none;
  font-family:Outfit,system-ui,sans-serif;color:#EDF2FF;-webkit-user-select:none;user-select:none}
canvas#cv{display:block;position:fixed;inset:0;width:100%;height:100%}
.ui{position:fixed;inset:0;pointer-events:none;z-index:5;padding:calc(env(safe-area-inset-top) + 12px) 14px}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.dep{font:700 30px JetBrains Mono,monospace;line-height:1}
.dep small{font:600 9px Outfit;letter-spacing:.26em;opacity:.45;display:block;margin-top:4px}
.lb{background:rgba(8,12,24,.5);border:1px solid rgba(120,160,255,.13);border-radius:11px;
  padding:7px 9px;min-width:120px}
.lb h4{font:600 8px Outfit;letter-spacing:.22em;opacity:.4;margin-bottom:5px}
.lb .r{display:flex;justify-content:space-between;gap:8px;font:700 10px JetBrains Mono,monospace;padding:1px 0;opacity:.7}
.lb .r.me{opacity:1;color:#5BE9FF}.lb .r.nm{color:#FF5C7A;opacity:1}
.lb .r i{font-style:normal;opacity:.4;width:10px}
.lb .r b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:64px}
.hud2{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:5;
  font:700 10px JetBrains Mono,monospace;opacity:.4}
.warn{position:fixed;top:0;left:0;right:0;height:140px;pointer-events:none;opacity:0;z-index:4;
  background:linear-gradient(180deg,rgba(255,40,90,.5),transparent)}
.bio{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom) + 96px);z-index:6;
  width:58px;height:58px;border-radius:50%;border:1.5px solid rgba(120,240,255,.5);
  background:rgba(60,200,255,.13);color:#8FF0FF;font:700 9px Chakra Petch;
  display:grid;place-items:center;line-height:1.25}
.bio:active{transform:scale(.92)}
.bio.off{opacity:.24;border-color:rgba(255,255,255,.15);color:rgba(255,255,255,.3)}
.boost{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:6;
  width:74px;height:74px;border-radius:50%;border:2px solid rgba(198,255,74,.45);
  background:rgba(150,255,60,.11);color:#D8FF8A;font:700 11px Chakra Petch;display:grid;place-items:center}
.boost.on{background:rgba(198,255,74,.32);transform:scale(.94)}
.veil{position:fixed;inset:0;z-index:10;background:rgba(2,4,10,.93);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;
  opacity:0;pointer-events:none;transition:opacity .25s}
.veil.on{opacity:1;pointer-events:auto}
.kill{font:600 9.5px Outfit;letter-spacing:.28em;text-transform:uppercase;opacity:.4}
.who{font:700 26px Chakra Petch;color:#FF5C7A;margin:2px 0 16px}
.big{font:700 58px JetBrains Mono,monospace;line-height:.9;text-align:center;color:#7FEFFF}
.big small{font:600 9.5px Outfit;letter-spacing:.28em;display:block;margin-top:8px;color:rgba(237,242,255,.4)}
.st{display:flex;gap:22px;margin:18px 0 20px}
.st div{text-align:center}.st b{font:700 19px JetBrains Mono,monospace;color:#C6FF4A;display:block}
.st span{font:500 8.5px Outfit;letter-spacing:.14em;text-transform:uppercase;opacity:.4}
.btn{width:min(300px,84vw);padding:16px;border:0;border-radius:15px;margin-top:8px;
  font:700 15px Chakra Petch;letter-spacing:.12em;color:#0A1220;background:linear-gradient(96deg,#C6FF4A,#5BE9FF)}
.btn:active{transform:scale(.97)}
.btn.ad{background:linear-gradient(96deg,#FFC93D,#FF7A4D);color:#20120A}
.nem{margin-top:13px;font:500 11px Outfit;opacity:.48}.nem b{color:#FF5C7A}
.tip{position:fixed;left:50%;top:52%;transform:translateX(-50%);z-index:7;text-align:center;
  font:500 12px Outfit;color:rgba(237,242,255,.5);pointer-events:none;transition:opacity .6s;width:80%}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="warn" id="warn"></div>
<div class="ui"><div class="top">
  <div class="dep"><span id="dep">0</span><small>METROS</small></div>
  <div class="lb"><h4>EN LA CAVERNA</h4><div id="lbb"></div></div>
</div></div>
<div class="hud2"><span id="hlen">12</span> · <span id="hfps">60</span>fps</div>
<button class="bio" id="bio">LUZ<br><span id="bn">2</span></button>
<button class="boost" id="bst">TURBO</button>
<div class="tip" id="tip">Un dedo dirige · el otro acelera<br>Acelerar consume tamaño</div>

<div class="veil on" id="veil">
  <div id="di" style="display:none;text-align:center">
    <div class="kill">Eliminado por</div><div class="who" id="who"></div></div>
  <div class="big"><span id="fd">ABISAL</span><small id="fl">toca para descender</small></div>
  <div class="st" id="fs" style="display:none">
    <div><b id="flen">0</b><span>largo</span></div>
    <div><b id="fbest">0</b><span>récord</span></div>
    <div><b id="fk">0</b><span>bajas</span></div></div>
  <button class="btn ad" id="bRev" style="display:none">REVIVIR · ANUNCIO</button>
  <button class="btn" id="bGo">DESCENDER</button>
  <div class="nem" id="nb" style="display:none">Némesis: <b id="nn"></b> · <span id="nc"></span></div>
</div>

<script>
/* ══════ CONFIG ══════ */
const CFG={
  W:1400, spd:5.4, boost:10.6, turn:.13,
  start:10, pts:1.5,        // puntos de trazo por unidad de largo
  food:120, tox:9, bots:8,
  light:210, lper:1.9, amb:.11,
  gain:.16, gainD:.30,      // crecimiento por bolita
  smooth:.055,              // suavizado (más bajo = más gradual)
  selfSkip:26               // segmentos iniciales inmunes a autocolisión
};
const NAMES=["KRAKEN","viborakiller","Ana_88","m0rt4l","luisfer","Nocturno","kenji","La_Bestia",
"Zeta9","pipo23","Mila","tuntun","Dr4go","elCubano","Nyx","Sombra","vortex7","kiko","Lupita",
"N30N","Bicho","tavo","QuetzaL","Puma_","Ares","Cheko","Onix","Vega","krlos","Tiburon","yuli","Bran"];
const PERS=[{a:.9,f:.3,c:.2},{a:.2,f:.9,c:.3},{a:.5,f:.5,c:.8},
            {a:.85,f:.6,c:.15},{a:.3,f:.4,c:.9},{a:.6,f:.85,c:.4}];

/* ══════ CANVAS ══════ */
const cv=document.getElementById('cv'),x=cv.getContext('2d',{alpha:false});
const lc=document.createElement('canvas'),lx=lc.getContext('2d');
let W,H,DPR,LS=.34;
function fit(){DPR=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;x.setTransform(DPR,0,0,DPR,0,0);
  lc.width=Math.ceil(W*LS);lc.height=Math.ceil(H*LS)}
addEventListener('resize',fit);fit();

/* sprite de luz (una sola vez) */
const LSP=document.createElement('canvas');LSP.width=LSP.height=192;
{const c=LSP.getContext('2d'),g=c.createRadialGradient(96,96,0,96,96,96);
 g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.45,'rgba(0,0,0,.93)');
 g.addColorStop(.78,'rgba(0,0,0,.48)');g.addColorStop(1,'rgba(0,0,0,0)');
 c.fillStyle=g;c.fillRect(0,0,192,192)}

/* 24 sprites de resplandor por tono — sustituye a shadowBlur */
const GLOW=[];
for(let i=0;i<24;i++){
  const c=document.createElement('canvas');c.width=c.height=48;
  const g=c.getContext('2d'),r=g.createRadialGradient(24,24,0,24,24,24);
  const h=i*15;
  r.addColorStop(0,`hsla(${h},100%,80%,1)`);r.addColorStop(.34,`hsla(${h},100%,64%,.62)`);
  r.addColorStop(1,`hsla(${h},100%,55%,0)`);
  g.fillStyle=r;g.fillRect(0,0,48,48);GLOW.push(c);
}
const gi=h=>GLOW[((Math.round(h/15)%24)+24)%24];

/* ruido */
let NPAT;{const n=document.createElement('canvas');n.width=n.height=96;
 const c=n.getContext('2d'),d=c.createImageData(96,96);
 for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;
  d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=9}
 c.putImageData(d,0,0);NPAT=x.createPattern(n,'repeat')}

/* 5 rocas precalculadas */
const ROCKS=[];
for(let k=0;k<5;k++){
  const S=260,c=document.createElement('canvas');c.width=c.height=S;
  const g=c.getContext('2d'),n=10;g.beginPath();
  for(let i=0;i<n;i++){const a=i/n*6.283,rr=S*.4*(.62+Math.random()*.5);
    const px=S/2+Math.cos(a)*rr,py=S/2+Math.sin(a)*rr*.8;i?g.lineTo(px,py):g.moveTo(px,py)}
  g.closePath();
  const lg=g.createLinearGradient(0,S*.1,0,S*.9);
  lg.addColorStop(0,'#54679B');lg.addColorStop(.55,'#2B3865');lg.addColorStop(1,'#161E3C');
  g.fillStyle=lg;g.fill();g.strokeStyle='rgba(165,195,255,.32)';g.lineWidth=2.4;g.stroke();
  g.save();g.clip();
  for(let v=0;v<4;v++){const a=Math.random()*6.283,L=S*(.2+Math.random()*.28);
    g.strokeStyle=`hsla(${160+Math.random()*80},85%,74%,.45)`;g.lineWidth=1+Math.random()*2;
    g.beginPath();g.moveTo(S/2,S/2);
    g.quadraticCurveTo(S/2+Math.cos(a)*L*.5-16,S/2+Math.sin(a)*L*.5+14,
                       S/2+Math.cos(a)*L,S/2+Math.sin(a)*L);g.stroke()}
  g.restore();ROCKS.push(c);
}

const R=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const hsh=(i,j)=>{const s=Math.sin(i*127.1+j*311.7)*43758.5453;return s-Math.floor(s)};

/* ══════ ESTADO ══════ */
let cam,ceil,depth,best=0,kills,run=false,tk=0,shake=0,tipT=0,
    food,tox,worms,parts,rocks,fx,bio,bioT,bands,
    nemesis=null,nemCnt=0,killer=null,revived,fpsV=60;

function mkW(p,y){return{p,name:p?'TÚ':pick(NAMES),per:p?null:pick(PERS),
  x:p?CFG.W/2:R(160,CFG.W-160),y,ang:1.57,len:CFG.start,tlen:CFG.start,
  path:[],hue:p?188:Math.floor(R(0,24))*15,boost:0,alive:true,tgt:null,th:0}}
const mkF=(a,b)=>({x:R(60,CFG.W-60),y:R(a,b),v:CFG.gain,h:170+R(-20,35),r:3.4,d:0});
const mkT=(a,b)=>({x:R(130,CFG.W-130),y:R(a,b),h:pick([90,300]),ph:R(0,6.3)});

function ensureRocks(){
  const b0=Math.floor((cam.y-800)/620),b1=Math.floor((cam.y+H+800)/620);
  for(let b=b0;b<=b1;b++){
    if(bands.has(b)||b<-1)continue;bands.add(b);
    for(let k=0;k<4;k++){
      const h1=hsh(b,k),h2=hsh(b+7,k*3),h3=hsh(b*3,k+5);
      rocks.push({sp:ROCKS[Math.floor(h2*5)%5],
        x:h1<.45?h2*110:(h1<.9?CFG.W-h2*110:250+h2*(CFG.W-500)),
        y:b*620+h3*620, sc:.6+h2*.8, fx:h1<.5?1:-1});
    }
  }
  rocks=rocks.filter(r=>r.y>cam.y-1500&&r.y<cam.y+H+1600);
}

function reset(){
  cam={x:0,y:0};ceil=-H*1.1;depth=0;kills=0;bio=2;bioT=0;revived=false;killer=null;
  food=[];tox=[];worms=[];parts=[];rocks=[];fx=[];bands=new Set();
  const p=mkW(true,340);
  for(let i=0;i<p.len*CFG.pts;i++)p.path.push({x:p.x,y:p.y});worms.push(p);
  for(let i=0;i<CFG.bots;i++){
    const b=mkW(false,R(250,1400));
    for(let j=0;j<b.len*CFG.pts;j++)b.path.push({x:b.x,y:b.y});worms.push(b);
  }
  for(let i=0;i<CFG.food;i++)food.push(mkF(0,1800));
  for(let i=0;i<CFG.tox;i++)tox.push(mkT(700,1800));
  ensureRocks();tipT=340;
}
const P=()=>worms[0];

/* ══════ CONTROL A DOS DEDOS ══════ */
let steerId=null,steer=null,boostHeld=false;
cv.addEventListener('pointerdown',e=>{
  if(steerId===null){steerId=e.pointerId;steer={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)}
  else boostHeld=true;
});
cv.addEventListener('pointermove',e=>{if(e.pointerId===steerId)steer={x:e.clientX,y:e.clientY}});
function up(e){if(e.pointerId===steerId){steerId=null;steer=null}else boostHeld=false}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

const bstB=document.getElementById('bst');
const bOn=e=>{e.preventDefault();boostHeld=true;bstB.classList.add('on')};
const bOff=e=>{e.preventDefault();boostHeld=false;bstB.classList.remove('on')};
bstB.addEventListener('pointerdown',bOn);bstB.addEventListener('pointerup',bOff);
bstB.addEventListener('pointercancel',bOff);bstB.addEventListener('pointerleave',bOff);

document.getElementById('bio').onclick=e=>{e.stopPropagation();
  if(bio<=0||!run)return;bio--;bioT=420;upB()};
const upB=()=>{document.getElementById('bn').textContent=bio;
  document.getElementById('bio').classList.toggle('off',bio<=0)};

/* ══════ IA ══════ */
function think(b){
  const q=b.per;let vx=0,vy=0,bf=null,bd=1e9;
  for(let i=0;i<food.length;i+=3){const f=food[i];
    const d=(f.x-b.x)**2+(f.y-b.y)**2;if(d<420*420&&d<bd){bd=d;bf=f}}
  if(bf){vx+=(bf.x-b.x)*q.f;vy+=(bf.y-b.y)*q.f}
  for(const w of worms){
    if(w===b||!w.alive)continue;
    const dx=w.x-b.x,dy=w.y-b.y,d=Math.hypot(dx,dy)||1;
    if(d<360){const big=w.len>b.len*1.2,f=(big?-1.3:q.a)*(1-d/360)*330;vx+=dx/d*f;vy+=dy/d*f}
    if(d<280)for(let i=4;i<w.path.length;i+=6){
      const s=w.path[i],ax=s.x-b.x,ay=s.y-b.y,d2=Math.hypot(ax,ay)||1;
      if(d2<115){vx-=ax/d2*(115-d2)*5*(1+q.c);vy-=ay/d2*(115-d2)*5*(1+q.c)}}
  }
  for(const t of tox){const dx=t.x-b.x,dy=t.y-b.y,d=Math.hypot(dx,dy)||1;
    if(d<180){vx-=dx/d*(180-d)*5;vy-=dy/d*(180-d)*5}}
  if(b.x<180)vx+=(180-b.x)*5;
  if(b.x>CFG.W-180)vx-=(b.x-(CFG.W-180))*5;
  if(b.y-ceil<420)vy+=(420-(b.y-ceil))*4;
  vy+=65;
  if(vx||vy)b.tgt=Math.atan2(vy,vx);
  b.boost=(q.a>.6&&bf&&bd<220*220&&Math.random()<.28)?1:0;
}

/* ══════ MUERTE: el cadáver queda sobre su propia línea ══════ */
function kill(w,by){
  if(!w.alive)return;w.alive=false;
  const n=w.path.length,tot=Math.max(3,Math.round(w.len*.55));
  const stp=Math.max(1,Math.floor(n/tot));
  for(let i=0;i<n;i+=stp){
    const s=w.path[i];
    food.push({x:s.x+R(-3,3),y:s.y+R(-3,3),v:CFG.gainD,h:w.hue,r:5.2,d:1});
  }
  for(let i=0;i<16;i++)parts.push({x:w.x,y:w.y,vx:R(-6,6),vy:R(-6,6),l:1,h:w.hue});
  fx.push({x:w.x,y:w.y,r:0,l:1,h:w.hue});
  if(w.p){killer=by;end()}else if(by&&by.p){kills++;shake=9}
}

/* ══════ LÓGICA ══════ */
function step(dt){
  tk++;const p=P();
  if(bioT>0)bioT-=dt;
  ceil+=(.58+depth*.0021)*dt;

  for(const w of worms){
    if(!w.alive)continue;
    if(w.p){
      if(steer){const dx=steer.x-W/2,dy=steer.y-H/2;
        if(Math.hypot(dx,dy)>10)w.tgt=Math.atan2(dy,dx)}
      w.boost=(boostHeld&&w.tlen>CFG.start+4)?1:0;
    }else if((w.th-=dt)<=0){think(w);w.th=3+Math.random()*3}

    if(w.tgt!=null){let d=((w.tgt-w.ang+Math.PI*3)%6.2832)-Math.PI;
      const a=CFG.turn*(w.p?1:.86)*dt;w.ang+=Math.max(-a,Math.min(a,d))}

    w.len+=(w.tlen-w.len)*CFG.smooth*dt;

    if(w.boost){
      w.tlen-=.028*dt;
      if(tk%5===0){const t=w.path[w.path.length-1];
        food.push({x:t.x,y:t.y,v:CFG.gain*.7,h:w.hue,r:3.2,d:0})}
    }
    const sp=(w.boost?CFG.boost:CFG.spd)*(1+Math.min(depth*.00035,.45))*dt;
    w.x+=Math.cos(w.ang)*sp;w.y+=Math.sin(w.ang)*sp;
    w.x=Math.max(30,Math.min(CFG.W-30,w.x));
    w.path.unshift({x:w.x,y:w.y});
    const need=Math.max(8,Math.floor(w.len*CFG.pts));
    while(w.path.length>need)w.path.pop();
    if(w.y<ceil)kill(w,null);
  }

  // comer
  for(const w of worms){
    if(!w.alive)continue;const rr=9+w.len*.085;
    for(let i=food.length-1;i>=0;i--){const f=food[i];
      if(Math.abs(f.y-w.y)>80)continue;
      if((f.x-w.x)**2+(f.y-w.y)**2<(rr+f.r+10)**2){
        w.tlen+=f.v;food.splice(i,1);
        if(w.p)parts.push({x:f.x,y:f.y,vx:R(-1.6,1.6),vy:R(-1.6,1.6),l:.5,h:f.h})}}
    for(const t of tox)if((t.x-w.x)**2+(t.y-w.y)**2<(rr+13)**2)kill(w,null);
  }
  // colisiones: ajenas Y propia
  for(const w of worms){
    if(!w.alive)continue;const rw=8+w.len*.085;
    for(const o of worms){
      if(!o.alive)continue;
      if(o!==w&&Math.abs(o.y-w.y)>620)continue;
      const ro=8+o.len*.085,from=(o===w)?CFG.selfSkip:4;
      for(let i=from;i<o.path.length;i+=2){const s=o.path[i];
        if((s.x-w.x)**2+(s.y-w.y)**2<(rw+ro*.75)**2){kill(w,o===w?null:o);break}}
      if(!w.alive)break;
    }
  }

  const low=cam.y+H+900;
  while(food.length<CFG.food)food.push(mkF(cam.y+H,low));
  food=food.filter(f=>f.y>ceil-320);
  while(tox.length<CFG.tox)tox.push(mkT(cam.y+H+300,low));
  tox=tox.filter(t=>t.y>ceil-320);
  const live=worms.filter(w=>w.alive&&!w.p).length;
  if(live<CFG.bots&&tk%34===0){const b=mkW(false,cam.y+H+R(300,750));
    for(let j=0;j<b.len*CFG.pts;j++)b.path.push({x:b.x,y:b.y});worms.push(b)}
  worms=worms.filter(w=>w.p||w.alive);

  if(p.alive){depth=Math.max(depth,Math.floor(p.y/10));
    cam.y+=((p.y-H*.42)-cam.y)*.16*dt;
    cam.x+=((p.x-W/2)-cam.x)*.16*dt;
    cam.x=Math.max(-30,Math.min(CFG.W-W+30,cam.x))}
  ensureRocks();

  for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.94;q.vy*=.94;q.l-=.025*dt}
  parts=parts.filter(q=>q.l>0);
  for(const g of fx){g.r+=10*dt;g.l-=.035*dt}fx=fx.filter(g=>g.l>0);

  document.getElementById('dep').textContent=depth;
  document.getElementById('hlen').textContent=Math.floor(p.len);
  const dz=(p.y-ceil)/H;
  document.getElementById('warn').style.opacity=p.alive&&dz<.36?(1-dz/.36).toFixed(2):0;
  if(tipT>0&&(tipT-=dt)<=0)document.getElementById('tip').style.opacity=0;
  if(tk%14===0)board();
}
function board(){
  const a=worms.filter(w=>w.alive).sort((m,n)=>n.len-m.len).slice(0,6);
  document.getElementById('lbb').innerHTML=a.map((w,i)=>
   `<div class="r ${w.p?'me':(w.name===nemesis?'nm':'')}"><i>${i+1}</i><b>${w.name}</b>${Math.floor(w.len)}</div>`).join('');
}

/* ══════ DIBUJO — cuerpo como TRAZO continuo, sin shadowBlur ══════ */
function drawWorm(w){
  const pa=w.path;if(pa.length<2)return;
  const r=8+w.len*.085;
  x.lineCap='round';x.lineJoin='round';
  x.beginPath();x.moveTo(pa[0].x,pa[0].y);
  for(let i=1;i<pa.length;i++)x.lineTo(pa[i].x,pa[i].y);
  // 3 pasadas = resplandor sin desenfoque
  x.strokeStyle=`hsla(${w.hue},100%,58%,.16)`;x.lineWidth=r*3.2;x.stroke();
  x.strokeStyle=`hsla(${w.hue},100%,62%,.34)`;x.lineWidth=r*2.1;x.stroke();
  x.strokeStyle=`hsla(${w.hue},100%,${w.boost?80:70}%,.96)`;x.lineWidth=r*1.25;x.stroke();
  x.strokeStyle=`hsla(${w.hue},100%,92%,.5)`;x.lineWidth=r*.45;x.stroke();
  // cabeza
  const gs=r*4.4;x.drawImage(gi(w.hue),w.x-gs/2,w.y-gs/2,gs,gs);
}

function render(){
  const p=P();
  x.save();
  if(shake>.4){x.translate(R(-shake,shake),R(-shake,shake));shake*=.85}
  x.translate(-cam.x,-cam.y);

  x.fillStyle='#0D1430';x.fillRect(cam.x-20,cam.y-20,W+40,H+40);
  const x0=Math.floor(cam.x/150)*150,gy=Math.floor((cam.y-160)/150)*150;
  for(let yy=gy;yy<cam.y+H+160;yy+=150)
    for(let xx=x0-150;xx<cam.x+W+160;xx+=150){
      const s=hsh(xx*.013,yy*.013);
      x.fillStyle=`rgba(${32+s*30},${44+s*38},${84+s*54},.5)`;
      x.beginPath();x.arc(xx+s*110,yy+s*110,30+s*58,0,6.29);x.fill();
    }
  for(const r of rocks){
    if(r.y<cam.y-420||r.y>cam.y+H+420)continue;
    x.save();x.translate(r.x,r.y);x.scale(r.fx*r.sc,r.sc);
    x.drawImage(r.sp,-130,-130);x.restore();
  }
  x.fillStyle='rgba(72,94,152,.5)';
  x.fillRect(0,cam.y-40,52,H+80);x.fillRect(CFG.W-52,cam.y-40,52,H+80);

  x.globalCompositeOperation='lighter';
  for(const w of worms)if(w.alive)drawWorm(w);
  x.globalCompositeOperation='source-over';
  for(const w of worms){
    if(!w.alive)continue;const r=8+w.len*.085;
    x.fillStyle='#050A18';
    for(const o of[-.5,.5]){x.beginPath();
      x.arc(w.x+Math.cos(w.ang+o)*r*.5,w.y+Math.sin(w.ang+o)*r*.5,r*.19,0,6.29);x.fill()}
  }
  x.restore();

  /* oscuridad */
  lx.setTransform(1,0,0,1,0,0);lx.globalCompositeOperation='source-over';
  lx.fillStyle=`rgba(3,5,12,${1-CFG.amb})`;lx.fillRect(0,0,lc.width,lc.height);
  lx.globalCompositeOperation='destination-out';
  const bo=bioT>0?Math.min(bioT/60,1):0;
  for(const w of worms){
    if(!w.alive)continue;
    const sx=(w.x-cam.x)*LS,sy=(w.y-cam.y)*LS;
    if(sx<-500||sx>lc.width+500||sy<-500||sy>lc.height+500)continue;
    let rad=(CFG.light+w.len*CFG.lper)*LS*(w.p?1+bo*2.6:1);
    lx.drawImage(LSP,sx-rad,sy-rad,rad*2,rad*2);
    for(let i=6;i<w.path.length;i+=7){
      const s=w.path[i],px=(s.x-cam.x)*LS,py=(s.y-cam.y)*LS,rr=rad*.4;
      lx.drawImage(LSP,px-rr,py-rr,rr*2,rr*2);
    }
  }
  lx.globalCompositeOperation='source-over';
  x.drawImage(lc,0,0,W,H);

  /* brilla pero no ilumina */
  x.save();x.translate(-cam.x,-cam.y);x.globalCompositeOperation='lighter';
  for(const f of food){
    if(f.y<cam.y-40||f.y>cam.y+H+40)continue;
    const s=f.d?22:13;x.drawImage(gi(f.h),f.x-s/2,f.y-s/2,s,s);
  }
  for(const t of tox){
    if(t.y<cam.y-70||t.y>cam.y+H+70)continue;
    const pl=.55+Math.sin(tk*.2+t.ph)*.45,s=42+pl*16;
    x.drawImage(gi(t.h),t.x-s/2,t.y-s/2,s,s);
    x.fillStyle=`hsla(${t.h},100%,${58+pl*18}%,.95)`;
    x.beginPath();x.arc(t.x,t.y,11,0,6.29);x.fill();
  }
  for(const q of parts){x.fillStyle=`hsla(${q.h},100%,74%,${q.l})`;x.fillRect(q.x,q.y,3.4,3.4)}
  for(const g of fx){x.strokeStyle=`hsla(${g.h},100%,74%,${g.l*.55})`;x.lineWidth=3;
    x.beginPath();x.arc(g.x,g.y,g.r,0,6.29);x.stroke()}
  x.globalCompositeOperation='source-over';

  x.font='600 11px Outfit';x.textAlign='center';
  for(const w of worms){
    if(!w.alive||w.p)continue;
    const d=Math.hypot(w.x-p.x,w.y-p.y);
    if(d<400){const al=1-d/400,n=w.name===nemesis;
      x.fillStyle=n?`rgba(255,80,110,${al})`:`rgba(237,242,255,${al*.55})`;
      x.fillText(w.name,w.x,w.y-(18+w.len*.1));
      if(n){x.strokeStyle=`rgba(255,60,100,${al*.6})`;x.lineWidth=2;
        x.beginPath();x.arc(w.x,w.y,22+w.len*.11,0,6.29);x.stroke()}}
  }
  x.textAlign='left';
  const cy=ceil-cam.y;
  if(cy>-200){x.fillStyle='#020308';x.fillRect(cam.x-20,cy-900,W+40,900);
    x.fillStyle='rgba(190,20,60,.32)';x.fillRect(cam.x-20,cy-12,W+40,14)}
  x.restore();

  x.fillStyle=NPAT;x.globalAlpha=.45;x.fillRect(0,0,W,H);x.globalAlpha=1;
}

/* ══════ BUCLE ══════ */
let last=performance.now(),fT=0,fC=0;
function loop(now){
  let dt=(now-last)/16.667;last=now;dt=Math.max(.35,Math.min(dt,2.8));
  fT+=now-last+16.667*dt;fC++;
  if(fC>=30){fpsV=Math.round(1000/(fT/fC));fT=0;fC=0;
    document.getElementById('hfps').textContent=fpsV}
  if(run)step(dt);
  render();
  requestAnimationFrame(loop);
}

/* ══════ PANTALLAS ══════ */
const veil=document.getElementById('veil');
function end(){
  run=false;best=Math.max(best,depth);
  if(killer){if(nemesis===killer.name)nemCnt++;else{nemesis=killer.name;nemCnt=1}}
  document.getElementById('di').style.display=killer?'block':'none';
  document.getElementById('who').textContent=killer?killer.name:'';
  document.getElementById('fd').textContent=depth;
  document.getElementById('fl').textContent='METROS DE PROFUNDIDAD';
  document.getElementById('fs').style.display='flex';
  document.getElementById('flen').textContent=Math.floor(P().len);
  document.getElementById('fbest').textContent=best;
  document.getElementById('fk').textContent=kills;
  document.getElementById('bRev').style.display=revived?'none':'block';
  document.getElementById('bGo').textContent='NUEVO DESCENSO';
  if(nemesis){document.getElementById('nb').style.display='block';
    document.getElementById('nn').textContent=nemesis;
    document.getElementById('nc').textContent=nemCnt+(nemCnt>1?' muertes':' muerte')}
  veil.classList.add('on');
}
document.getElementById('bGo').onclick=()=>{reset();upB();board();
  document.getElementById('tip').style.opacity=1;veil.classList.remove('on');
  last=performance.now();run=true};
document.getElementById('bRev').onclick=()=>{
  revived=true;const p=P();p.alive=true;
  p.tlen=Math.max(CFG.start,p.tlen*.7);p.len=p.tlen;
  p.y=Math.max(p.y,ceil+H*.62);p.path=[];
  for(let i=0;i<p.len*CFG.pts;i++)p.path.push({x:p.x,y:p.y});
  for(const w of worms)if(!w.p&&w.alive&&Math.hypot(w.x-p.x,w.y-p.y)<300)kill(w,null);
  bio=Math.max(bio,1);bioT=380;upB();
  veil.classList.remove('on');last=performance.now();run=true;
};
reset();upB();board();requestAnimationFrame(loop);
</script>
