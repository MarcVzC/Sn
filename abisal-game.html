<script>

let AC=null,master=null,musGain=null,musOn=true,sfxOn=true,musNodes=[];
function audioInit(){
  if(AC)return;
  try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);
  musGain=AC.createGain();musGain.gain.value=0;musGain.connect(master);
}
function env(node,t0,a,d,peak){
  const g=AC.createGain();g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(peak,t0+a);
  g.gain.exponentialRampToValueAtTime(.0001,t0+a+d);
  node.connect(g);g.connect(master);return g}
function tone(f0,f1,a,d,peak,type){
  if(!AC||!sfxOn)return;
  const t=AC.currentTime,o=AC.createOscillator();
  o.type=type||'sine';o.frequency.setValueAtTime(f0,t);
  if(f1)o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+a+d);
  env(o,t,a,d,peak);o.start(t);o.stop(t+a+d+.02)}
function noise(dur,peak,f){
  if(!AC||!sfxOn)return;
  const t=AC.currentTime,n=Math.floor(AC.sampleRate*dur);
  const buf=AC.createBuffer(1,n,AC.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);
  const src=AC.createBufferSource();src.buffer=buf;
  const flt=AC.createBiquadFilter();flt.type='bandpass';flt.frequency.value=f||900;flt.Q.value=1.2;
  src.connect(flt);env(flt,t,.005,dur,peak);src.start(t)}
function sfx(k){
  if(!AC||!sfxOn)return;
  switch(k){
   case 'eat':   tone(560+Math.random()*120,900,.005,.06,.10,'sine');break;
   case 'orb':   tone(680,1500,.004,.16,.16,'triangle');
                 tone(1020,1900,.004,.12,.07,'sine');break;
   case 'kill':  tone(320,90,.005,.34,.22,'sawtooth');noise(.22,.16,1400);break;
   case 'death': tone(240,50,.01,.9,.26,'sawtooth');noise(.5,.14,500);break;
   case 'level': [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,f*1.5,.006,.3,.13,'triangle'),i*95));break;
   case 'pup':   [700,1050,1400].forEach((f,i)=>setTimeout(()=>tone(f,f*1.3,.004,.22,.11,'sine'),i*55));break;
   case 'shield':tone(300,900,.01,.4,.18,'square');break;
   case 'flash': noise(.5,.3,2200);tone(1200,200,.005,.6,.14,'sine');break;
   case 'win':   [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,f,.01,.5,.17,'triangle'),i*130));break;
  }
}
const MUS=[
 {root:55.00,sc:[0,3,5,7,10],prog:[0,-2,3,-4],bpm:82,name:'raices'},
 {root:61.74,sc:[0,2,4,7,11],prog:[0,5,3,7],  bpm:90,name:'cristal'},
 {root:51.91,sc:[0,1,3,7,8], prog:[0,-1,4,-3],bpm:96,name:'esporas'},
 {root:43.65,sc:[0,3,5,6,10],prog:[0,3,-2,5], bpm:104,name:'magma'},
 {root:36.71,sc:[0,2,3,7,10],prog:[0,-4,2,-2],bpm:74,name:'vacio'}];
let mus=null,musStep=0,musNext=0,musLoop=null,musBus=null,musDelay=null;
const semi=n=>Math.pow(2,n/12);
function musBuild(){
  if(musBus)return;
  musBus=AC.createGain();musBus.gain.value=1;
  const comp=AC.createDynamicsCompressor();
  comp.threshold.value=-18;comp.ratio.value=4;
  musDelay=AC.createDelay(1);musDelay.delayTime.value=.42;
  const fb=AC.createGain();fb.gain.value=.34;
  const dw=AC.createGain();dw.gain.value=.3;
  musBus.connect(comp);comp.connect(musGain);
  musBus.connect(musDelay);musDelay.connect(fb);fb.connect(musDelay);
  musDelay.connect(dw);dw.connect(musGain);
}
function mVoice(f,t,dur,peak,type,cut){
  const o=AC.createOscillator(),g=AC.createGain(),fl=AC.createBiquadFilter();
  o.type=type;o.frequency.value=f;
  fl.type='lowpass';fl.frequency.setValueAtTime(cut||1600,t);
  fl.frequency.exponentialRampToValueAtTime(Math.max(200,(cut||1600)*.35),t+dur);
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(peak,t+Math.min(.08,dur*.25));
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(fl);fl.connect(g);g.connect(musBus);
  o.start(t);o.stop(t+dur+.03)}
function mNoise(t,dur,peak,f,q){
  const n=Math.floor(AC.sampleRate*dur),buf=AC.createBuffer(1,n,AC.sampleRate);
  const ch=buf.getChannelData(0);
  for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const src=AC.createBufferSource();src.buffer=buf;
  const fl=AC.createBiquadFilter();fl.type='bandpass';fl.frequency.value=f;fl.Q.value=q||1;
  const g=AC.createGain();g.gain.value=peak;
  src.connect(fl);fl.connect(g);g.connect(musBus);src.start(t)}
function musTick(){
  if(!AC||!mus||!musOn)return;
  const spb=60/mus.bpm/4;                        // semicorchea
  while(musNext<AC.currentTime+.25){
    const t=musNext,st=musStep%64,bar=Math.floor(st/16),beat=st%16;
    const ch=mus.prog[bar],base=mus.root*semi(ch);
    // pad: acorde largo al inicio de cada compás
    if(beat===0){
      [0,mus.sc[2],mus.sc[4],12].forEach((iv,i)=>
        mVoice(base*semi(iv)*(i===3?2:1),t,spb*15,.030,'sawtooth',700+i*160))}
    // bajo: pulso
    if(beat%4===0)mVoice(base/2,t,spb*2.6,.085,'triangle',420);
    if(beat===6||beat===14)mVoice(base/2*semi(mus.sc[1]),t,spb*1.6,.055,'triangle',380);
    // percusión suave
    if(beat%8===0)mNoise(t,.16,.05,120,.8);
    if(beat%4===2)mNoise(t,.05,.022,5200,1.6);
    // arpegio: una carrera de vez en cuando
    if(beat===8&&Math.random()<.55){
      for(let k=0;k<6;k++){
        const iv=mus.sc[(k+bar)%mus.sc.length]+(k>3?12:0);
        mVoice(base*semi(iv)*2,t+k*spb,spb*2.2,.036,'sine',2400)}}
    // nota suelta con eco
    if(beat===12&&Math.random()<.5){
      const iv=mus.sc[Math.floor(Math.random()*mus.sc.length)];
      mVoice(base*semi(iv)*4,t,spb*6,.030,'sine',3000)}
    musNext+=spb;musStep++}
}
function musicStop(){
  if(musLoop){clearInterval(musLoop);musLoop=null}
  mus=null;
  if(AC&&musGain)musGain.gain.setTargetAtTime(0,AC.currentTime,.5)}
function musicStart(bi){
  if(!AC)return;
  musBuild();
  const wasNull=!mus;
  mus={...MUS[bi%5]};
  mus.bpm=MUS[bi%5].bpm+(typeof lvl==='number'?(lvl-1)*3:0);
  if(wasNull||!musLoop){
    musStep=0;musNext=AC.currentTime+.1;
    musLoop=setInterval(musTick,60)}
  musGain.gain.cancelScheduledValues(AC.currentTime);
  musGain.gain.setTargetAtTime(musOn?.62:0,AC.currentTime,1.0)}
function toggleAudio(){
  audioInit();musOn=!musOn;sfxOn=musOn;
  if(AC)musGain.gain.setTargetAtTime(musOn?.5:0,AC.currentTime,.4);
  document.getElementById('bSnd').textContent=musOn?'♪':'✕';
  document.getElementById('bSnd').style.opacity=musOn?.55:.25}

const LG=(()=>{

  return (navigator.language||'en').toLowerCase().startsWith('es')?'es':'en'})();
const STR={
 es:{len:'LARGO',lvl:'NIVEL',cave:'EN LA CAVERNA',turbo:'turbo',steer:'dirigir',

  sLen:'largo',sLvl:'nivel',sTm:'tiempo',sK:'bajas',

const cv=document.getElementById('cv'),x=cv.getContext('2d',{alpha:false});
const lc=document.createElement('canvas'),lx=lc.getContext('2d');
const bc=document.createElement('canvas'),bx=bc.getContext('2d');
let W,H,DPR,LS=.34,BS=.25;
function fit(){
  DPR=Math.min(devicePixelRatio||1,1.5);
  W=Math.max(1,innerWidth||document.documentElement.clientWidth||360);
  H=Math.max(1,innerHeight||document.documentElement.clientHeight||640);

// ¿hay cuerpo ajeno cerca de (px,py)?
function occupied(px,py,rad,self){
  const c0=Math.floor((px-rad)/CFG.GS),c1=Math.floor((px+rad)/CFG.GS);
  const r0=Math.floor((py-rad)/CFG.GS),r1=Math.floor((py+rad)/CFG.GS);
  for(let cy=r0;cy<=r1;cy++)for(let cx=c0;cx<=c1;cx++){
    const k=((cy%GR)+GR)%GR*GC+((cx%GC)+GC)%GC;
    const cell=grid[k];if(!cell)continue;
    for(const p of cell){

      if(dist2(p.x,p.y,px,py)<t*t)return true}
  }

function clearance(b,ang,maxD){
  const cx=Math.cos(ang),cy=Math.sin(ang),rr=10+b.len*.085,STEP=maxD/5;
  for(let t=STEP;t<=maxD;t+=STEP){
    const px=wrapX(b.x+cx*t),py=wrapY(b.y+cy*t);

    for(const s of tox)if(dist2(s.x,s.y,px,py)<(rr+22)*(rr+22))return t-STEP*.5;
  }
  return maxD;
}

function chooseGoal(b){
  const q=b.per;let best=null,bs=-1e9;
  for(let i=0;i<food.length;i++){
    const f=food[i],ax=dX(f.x,b.x),ay=dY(f.y,b.y);
    const d2=ax*ax+ay*ay;
    if(d2>900*900)continue;
    const d=Math.sqrt(d2);
    let val=f.d?26:1;
    if(f.d)val+=6;
    const sc=val*q.f*340/(d+90);
    if(sc>bs){bs=sc;best={t:'food',gx:f.x,gy:f.y,big:!!f.d}}}
  for(const w of worms){
    if(w===b||!w.alive)continue;
    const ax=dX(w.x,b.x),ay=dY(w.y,b.y),d=Math.hypot(ax,ay);
    if(d<26)continue;
    if(w.len<b.len*.86&&q.a>.2&&d<620){
      const lead=Math.min(d*.55,d/CFG.spd*.42*b.sk);
      const sc=(w.len*2.6+70)*q.a*300/(d+110);
      if(sc>bs){bs=sc;best={t:'hunt',
        gx:wrapX(w.x+Math.cos(w.ang)*lead),gy:wrapY(w.y+Math.sin(w.ang)*lead)}}}
    if(w.len>b.len*1.12&&d<300){
      if(Math.cos(w.ang)*(-ax)+Math.sin(w.ang)*(-ay)>0){
        const sc=(680-d)*(.8+q.c)*1.5*b.sk;
        if(sc>bs){bs=sc;best={t:'flee',
          gx:wrapX(b.x-ax/d*400),gy:wrapY(b.y-ay/d*400)}}}}}
  if(!best){
    const a=b.ang+R(-.8,.8);
    best={t:'roam',gx:wrapX(b.x+Math.cos(a)*400),gy:wrapY(b.y+Math.sin(a)*400)}}
  b.goal=best;b.gT=best.t==='food'?9:6}
const DIRS=13;
function think(b,dt){
  const q=b.per;
  if((b.gT-=dt)<=0)chooseGoal(b);
  if((b.dT-=dt)>0)return;
  b.dT=3;
  let gAng=b.ang,gd=99999;
  if(b.goal){
    const dx=dX(b.goal.gx,b.x),dy=dY(b.goal.gy,b.y);
    gd=Math.hypot(dx,dy);
    if(gd<24){b.goal=null;b.gT=0;chooseGoal(b);
      if(b.goal){const ex=dX(b.goal.gx,b.x),ey=dY(b.goal.gy,b.y);
        gd=Math.hypot(ex,ey);gAng=Math.atan2(ey,ex)}}
    else gAng=Math.atan2(dy,dx)}
  b.gd=gd;
  const rr=10+b.len*.085;
  const need=52+rr*3.4;
  const look=need+90+b.sk*70+(b.boost?70:0);
  if(b.lastOff===undefined)b.lastOff=0;
  let bestA=b.ang,bestS=-1e9,bestOff=0;
  for(let i=0;i<DIRS;i++){
    const off=(i-(DIRS-1)/2)*(2.5/DIRS)*2;
    const a=b.ang+off;
    const cl=clearance(b,a,look);
    const dg=((gAng-a+Math.PI*3)%6.2832)-Math.PI;
    const align=Math.cos(dg);
    let sc=align*2.8;
    if(cl<need)sc-=(1-cl/need)*9;
    else sc+=Math.min(1,(cl-need)/160)*.9;
    sc-=Math.abs(off)*.18;
    sc+=Math.max(0,.35-Math.abs(off-b.lastOff)*.6);
    if(sc>bestS){bestS=sc;bestA=a;bestOff=off}}
  b.lastOff=bestOff*.6;
  b.tgt=bestA;
  const g=b.goal;
  const wantB=b.tlen>CFG.start+12&&!!g&&
    ((g.t==='hunt'&&gd<210)||(g.t==='flee'&&gd<300)||(g.t==='food'&&g.big&&gd<260));
  if(wantB&&!b.boost&&Math.random()<q.b*.10)b.boost=1;
  else if(b.boost&&(!wantB||Math.random()<.04))b.boost=0;
}

  for(const w of worms){

function pathScreen(ctx,pa,sc){

  for(let i=0;i<pa.length;i++){
    const px=(W/2+dX(pa[i].x,cam.x))*sc,py=(H/2+dY(pa[i].y,cam.y))*sc;
    if(prev&&(Math.abs(px-prev[0])>W*sc*.6||Math.abs(py-prev[1])>H*sc*.6))started=false;
    if(!started){ctx.moveTo(px,py);started=true}else ctx.lineTo(px,py);
    prev=[px,py]}}
function drawWorm(w){
  const pa=w.path;if(pa.length<2)return;
  const r=8+w.len*.085;

  x.strokeStyle=`hsla(${w.hue},100%,58%,.13)`;x.lineWidth=r*3.2;x.stroke();
  x.strokeStyle=`hsla(${w.hue},100%,62%,.3)`;x.lineWidth=r*2.0;x.stroke();

    x.strokeStyle='hsla('+c[0]+','+c[1]+'%,'+(c[2]+(w.boost?12:0))+'%,.96)'}
  else x.strokeStyle=`hsla(${w.hue},100%,${w.boost?84:68}%,.96)`;
  x.lineWidth=r*1.25;x.stroke();
  const vis=i=>{const px=sx(pa[i].x),py=sy(pa[i].y);
    return(px>-50&&px<W+50&&py>-50&&py<H+50)?[px,py]:null};
  const nrm=i=>Math.atan2(dY(pa[i+1].y,pa[i].y),dX(pa[i+1].x,pa[i].x))+1.5708;
  switch(w.pat){
   case 0: x.strokeStyle=`hsla(${w.hue},100%,97%,.62)`;x.lineWidth=r*.36;x.stroke();break;
   case 1: x.setLineDash([r*1.15,r*1.05]);
     x.strokeStyle=`hsla(${(w.hue+180)%360},100%,82%,.55)`;x.lineWidth=r*.95;x.stroke();
     x.setLineDash([]);break;
   case 2: x.fillStyle=`hsla(${(w.hue+40)%360},100%,90%,.6)`;
     for(let i=3;i<pa.length-1;i+=5){const v=vis(i);if(!v)continue;

       x.beginPath();x.arc(v[0]-Math.cos(a)*d,v[1]-Math.sin(a)*d,r*.2,0,6.29);x.fill()}break;
   case 3: x.strokeStyle=`hsla(${(w.hue+150)%360},100%,88%,.6)`;x.lineWidth=Math.max(1,r*.22);
     for(let i=4;i<pa.length-1;i+=7){const v=vis(i);if(!v)continue;
       x.beginPath();x.arc(v[0],v[1],r*.72,0,6.29);x.stroke()}break;
   case 4: x.strokeStyle=`hsla(${(w.hue+300)%360},100%,86%,.5)`;x.lineWidth=Math.max(1,r*.16);
     x.beginPath();
     for(let i=3;i<pa.length-1;i+=4){const v=vis(i);if(!v)continue;

       x.moveTo(v[0],v[1]);x.lineTo(v[0]-Math.cos(a)*d,v[1]-Math.sin(a)*d)}
     x.stroke();break;
   case 5: { // placas segmentadas
     x.strokeStyle=`hsla(${(w.hue+20)%360},100%,92%,.5)`;x.lineWidth=Math.max(1,r*.18);

       x.lineTo(v[0]-Math.cos(a)*d,v[1]-Math.sin(a)*d);x.stroke()}break}
   case 6: { // cresta zigzag
     x.strokeStyle=`hsla(${(w.hue+60)%360},100%,90%,.55)`;x.lineWidth=Math.max(1,r*.2);
     x.beginPath();let st=false;
     for(let i=3;i<pa.length-1;i+=3){const v=vis(i);if(!v){st=false;continue}
       const a=nrm(i),d=r*.8*((i>>1)%2?1:-1);
       const px=v[0]+Math.cos(a)*d,py=v[1]+Math.sin(a)*d;
       st?x.lineTo(px,py):(x.moveTo(px,py),st=true)}
     x.stroke();break}
   default: { // doble franja
     x.strokeStyle=`hsla(${(w.hue+330)%360},100%,92%,.5)`;x.lineWidth=Math.max(1,r*.15);
     for(const sgn of[-1,1]){x.beginPath();let st=false;

  else if(w.fin===2){x.strokeStyle=`hsla(${w.hue},100%,94%,.55)`;x.lineWidth=Math.max(1,r*.15);

  x.globalAlpha=1}

  fT+=raw;fC++;
  if(fC>=30){fpsV=Math.round(1000/(fT/fC));fT=0;fC=0;
    document.getElementById('hfps').textContent=fpsV}
  try{ if(run)step(dt); render(); }catch(err){ console.error(err) }}

function send(type,payload){
  if(embedded)parent.postMessage({type,payload},'*')}
/* PUNTOS = largo máximo + nivel×40 + bajas×60. Siempre se suman: no hay que ganar. */
let prevLen=CFG.start,usedDes=false;
let usedRev=false,usedX2=false,won=false,maxLen=0,lastPts=0,deadLen=0;
function calcPts(){return Math.floor(maxLen)+lvl*40+kills*60}
function showEnd(){
  const d=document.getElementById('solo');
  document.getElementById('sKill').style.display=(killer||won)?'block':'none';
  document.getElementById('sWho').textContent=won?T.survivor:(killer?killer.name:'');
  document.getElementById('sWho').style.color=won?'#C6FF4A':'#FF5C7A';
  document.getElementById('sKill').querySelector('.kl').textContent=
    won?T.survived:T.killedBy;
  document.getElementById('sPts').textContent=lastPts;
  document.getElementById('sLab').textContent=T.pts;
  document.getElementById('sSt').style.display='flex';
  document.getElementById('sLen').textContent=Math.floor(maxLen);
  document.getElementById('sLvl').textContent=lvl;
  document.getElementById('sTm').textContent=fmt(tmr);
  document.getElementById('sK').textContent=kills;
  document.getElementById('sX2').classList.toggle('on',usedX2);
  document.getElementById('bX2').style.display=usedX2?'none':'block';
  document.getElementById('bRev').style.display=(usedRev||won)?'none':'block';
  document.getElementById('soloBtn').textContent=T.bAgain;
  d.classList.add('on')}
function win(){
  run=false;won=true;musicStop();
  maxLen=Math.max(maxLen,P().len);
  lastPts=calcPts()+800;                       // bonificación por sobrevivir
  coins+=200;
  sfx('win');
  send('abisal:over',{pts:lastPts,len:Math.floor(maxLen),lvl,time:Math.floor(tmr/60),
    kills,coins,inv:{...inv},killer:null,won:true,nemesis,nemCnt,
    canRevive:false,canX2:!usedX2});
  showEnd()}
function end(){
  run=false;musicStop();
  deadLen=P().len;
  maxLen=Math.max(maxLen,deadLen);
  lastPts=calcPts();
  if(killer){if(nemesis===killer.name)nemCnt++;else{nemesis=killer.name;nemCnt=1}}
  send('abisal:over',{pts:lastPts,len:Math.floor(maxLen),lvl,time:Math.floor(tmr/60),
    kills,coins,inv:{...inv},killer:killer?killer.name:null,nemesis,nemCnt,
    canRevive:!usedRev,canX2:!usedX2});
  showEnd()}
function doX2(){                       // ilimitado
  if(usedX2)return;usedX2=true;lastPts*=2;
  coins+=Math.floor(lastPts/10);
  send('abisal:coins',{coins});showEnd()}
function doRevive(){                   // una sola vez por partida
  if(usedRev)return;usedRev=true;
  const p=P();p.alive=true;p.new=150;p.esc=0;
  p.tlen=CFG.start;p.len=CFG.start;
  const s=safeSpawn();if(s){p.x=s.x;p.y=s.y}
  seedPath(p);pwHud();
  document.getElementById('solo').classList.remove('on');
  killer=null;last=performance.now();run=true}
const SKINF={
 neon:(i,t)=>[196+i*3,100,74-i*1.4],prisma:(i,t)=>[(i*11+t*2)%360,95,66],
 magma:(i,t)=>[34-i*1.6,100,64-i*1.1],toxico:(i,t)=>[86+i*2,100,62-i*.9],
 glaciar:(i,t)=>[186+i*1.2,72,86-i*2.2],coral:(i,t)=>[340+i*1.8,92,72-i*1.2],
 jade:(i,t)=>[152+i*1.4,70,68-i*1.3],ambar:(i,t)=>[44-i*.9,96,70-i*1.5],
 abismo:(i,t)=>[228+i*2.4,88,60-i*1.6],espectro:(i,t)=>[270+i*3,85,66-i*1.2],
 oxido:(i,t)=>[18+Math.sin(i*.6)*14,78,58-i],plasma:(i,t)=>[(300+i*6+t*3)%360,100,70-i*.8],
 aurora:(i,t)=>[140+Math.sin(i*.25+t*.04)*80,88,68],obsidiana:(i,t)=>[258+i*1.2,42,40-i*.7],
 sangre:(i,t)=>[354-i*1.1,94,56-i*1.1],vacio:(i,t)=>[282+i*2,88,58-i],
 oro:(i,t)=>[46+Math.sin(i*.4+t*.05)*8,95,76-i*1.4],
 cuantico:(i,t)=>[(i*29+t*6)%360,100,72+Math.sin(t*.1+i)*10]};
const FONDOF={abisal:[[13,22,42],[104,128,168]],ceniza:[[26,24,28],[150,142,132]],
 esmeralda:[[8,30,24],[86,176,140]],carmesi:[[32,8,16],[190,80,90]],
 solar:[[36,22,6],[228,168,72]],nebulosa:[[18,8,40],[150,110,220]]};
let mySkin=null,myFondo=null;
function start(cfg){
  fit();
  if(cfg&&cfg.skin&&SKINF[cfg.skin])mySkin=SKINF[cfg.skin];
  if(cfg&&cfg.fondo&&FONDOF[cfg.fondo])myFondo=FONDOF[cfg.fondo];
  if(cfg&&typeof cfg.sfx==='boolean')sfxOn=cfg.sfx;
  if(cfg&&typeof cfg.music==='boolean')musOn=cfg.music;
  if(cfg&&cfg.inv)inv={...cfg.inv};
  if(cfg&&typeof cfg.coins==='number')coins=cfg.coins;
  usedRev=false;usedX2=false;won=false;usedDes=false;maxLen=CFG.start;lastPts=0;prevLen=CFG.start;
  audioInit();if(AC&&AC.state==='suspended')AC.resume();
  document.getElementById('solo').classList.remove('on');
  reset();board();musicStart(0);document.getElementById('tip').style.opacity=1;
  last=performance.now();run=true}
addEventListener('message',e=>{
  const m=e.data||{};
  if(m.type==='abisal:start')start(m.payload||{});
  else if(m.type==='abisal:stop')run=false;
  else if(m.type==='abisal:revive')doRevive();
  else if(m.type==='abisal:x2')doX2();
  else if(m.type==='abisal:setInv'){inv={...(m.payload||{})};pwHud()}
  else if(m.type==='abisal:settings'){const p=m.payload||{};
    if(typeof p.sfx==='boolean')sfxOn=p.sfx;
    if(typeof p.music==='boolean'){musOn=p.music;
      if(AC&&musGain)musGain.gain.setTargetAtTime(musOn?.62:0,AC.currentTime,.4)}}});

document.getElementById('soloBtn').onclick=()=>start({});
document.getElementById('bSnd').onclick=e=>{e.stopPropagation();toggleAudio()};
document.getElementById('bX2').onclick=doX2;
document.getElementById('bRev').onclick=doRevive;
applyLang();reset();board();requestAnimationFrame(loop);
if(embedded)send('abisal:ready',{lang:LG});
</script>
