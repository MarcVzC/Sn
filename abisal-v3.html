<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>ABISAL</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Outfit:wght@500;600&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;touch-action:none;
  font-family:Outfit,system-ui,sans-serif;color:#EDF2FF;-webkit-user-select:none;user-select:none}
canvas#cv{display:block;position:fixed;inset:0;width:100%;height:100%}
.ui{position:fixed;inset:0;pointer-events:none;z-index:5;
  padding:calc(env(safe-area-inset-top) + 12px) 14px}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.dep{font:700 30px JetBrains Mono,monospace;line-height:1;text-shadow:0 0 18px rgba(90,220,255,.55)}
.dep small{font:600 9px Outfit;letter-spacing:.26em;opacity:.45;display:block;margin-top:4px}
.lb{background:rgba(8,12,24,.5);border:1px solid rgba(120,160,255,.13);border-radius:11px;
  padding:7px 9px;min-width:124px}
.lb h4{font:600 8px Outfit;letter-spacing:.22em;opacity:.4;margin-bottom:5px}
.lb .r{display:flex;justify-content:space-between;gap:8px;font:700 10px JetBrains Mono,monospace;
  padding:1px 0;opacity:.72}
.lb .r.me{opacity:1;color:#5BE9FF}.lb .r.nm{color:#FF5C7A;opacity:1}
.lb .r i{font-style:normal;opacity:.4;width:10px}
.lb .r b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:68px}
.fps{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:5;
  font:700 9px JetBrains Mono,monospace;opacity:.3}
.warn{position:fixed;top:0;left:0;right:0;height:140px;pointer-events:none;opacity:0;z-index:4;
  background:linear-gradient(180deg,rgba(255,40,90,.5),transparent)}
.fbtn{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:6;
  width:60px;height:60px;border-radius:50%;border:1.5px solid rgba(255,210,90,.5);
  background:rgba(255,180,50,.12);color:#FFD86A;font:700 10px Chakra Petch;
  display:grid;place-items:center;box-shadow:0 0 20px rgba(255,190,60,.24)}
.fbtn:active{transform:scale(.92)}
.fbtn.off{opacity:.25;border-color:rgba(255,255,255,.16);color:rgba(255,255,255,.32);box-shadow:none}
.veil{position:fixed;inset:0;z-index:10;background:rgba(2,4,10,.93);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;
  opacity:0;pointer-events:none;transition:opacity .25s}
.veil.on{opacity:1;pointer-events:auto}
.kill{font:600 9.5px Outfit;letter-spacing:.28em;text-transform:uppercase;opacity:.4}
.who{font:700 26px Chakra Petch;color:#FF5C7A;margin:2px 0 16px}
.big{font:700 60px JetBrains Mono,monospace;line-height:.9;text-align:center;color:#7FEFFF}
.big small{font:600 9.5px Outfit;letter-spacing:.28em;display:block;margin-top:8px;
  color:rgba(237,242,255,.4)}
.st{display:flex;gap:22px;margin:18px 0 20px}
.st div{text-align:center}.st b{font:700 19px JetBrains Mono,monospace;color:#C6FF4A;display:block}
.st span{font:500 8.5px Outfit;letter-spacing:.14em;text-transform:uppercase;opacity:.4}
.btn{width:min(300px,84vw);padding:16px;border:0;border-radius:15px;margin-top:8px;
  font:700 15px Chakra Petch;letter-spacing:.12em;color:#0A1220;
  background:linear-gradient(96deg,#C6FF4A,#5BE9FF)}
.btn:active{transform:scale(.97)}
.btn.ad{background:linear-gradient(96deg,#FFC93D,#FF7A4D);color:#20120A}
.nem{margin-top:13px;font:500 11px Outfit;opacity:.48}.nem b{color:#FF5C7A}
.tip{position:fixed;left:50%;top:62%;transform:translateX(-50%);z-index:7;text-align:center;
  font:500 12px Outfit;color:rgba(237,242,255,.5);pointer-events:none;transition:opacity .6s;width:82%}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="warn" id="warn"></div>
<div class="ui"><div class="top">
  <div class="dep"><span id="dep">0</span><small>METROS</small></div>
  <div class="lb"><h4>EN LA CAVERNA</h4><div id="lbb"></div></div>
</div></div>
<div class="fps" id="fps"></div>
<button class="fbtn" id="fb">BENGALA<br><span id="fn">2</span></button>
<div class="tip" id="tip">Arrastra el dedo para dirigirte<br>Aléjalo para acelerar</div>

<div class="veil on" id="veil">
  <div id="di" style="display:none;text-align:center">
    <div class="kill">Eliminado por</div><div class="who" id="who"></div></div>
  <div class="big"><span id="fd">ABISAL</span><small id="fl">toca para descender</small></div>
  <div class="st" id="fs" style="display:none">
    <div><b id="flen">0</b><span>largo</span></div>
    <div><b id="fbest">0</b><span>récord</span></div>
    <div><b id="fk">0</b><span>bajas</span></div></div>
  <button class="btn ad" id="bRev" style="display:none">REVIVIR · ANUNCIO</button>
  <button class="btn" id="bGo">DESCENDER</button>
  <div class="nem" id="nb" style="display:none">Némesis: <b id="nn"></b> · <span id="nc"></span></div>
</div>

<script>
/* ═══ CONFIG ═══ */
const CFG={W:1500,spd:5.6,boost:10.4,turn:.125,seg:3.0,start:12,
  food:170,tox:22,bots:9,light:200,lper:2.2,amb:.10,
  gain:.28,      // largo por bolita normal
  gainD:.55,     // largo por bolita de cadáver
  smooth:.10};   // suavizado del crecimiento

const NAMES=["KRAKEN","viborakiller","Ana_88","m0rt4l","luisfer","Nocturno","kenji","La_Bestia",
"Zeta9","pipo23","Mila","tuntun","Dr4go","elCubano","Nyx","Rafa__","Sombra","vortex7","kiko",
"Lupita","N30N","Bicho","tavo","QuetzaL","Puma_","Ares","Cheko","Onix","Vega","krlos","Tiburon",
"yuli","NEXO_","Bran","Chino","Maya","Zurdo","Pulpo"];
const PERS=[{a:.9,f:.3,c:.2},{a:.2,f:.9,c:.3},{a:.5,f:.5,c:.8},
            {a:.85,f:.6,c:.15},{a:.3,f:.4,c:.9},{a:.6,f:.85,c:.4}];

/* ═══ CANVAS ═══ */
const cv=document.getElementById('cv'),x=cv.getContext('2d',{alpha:false});
const lc=document.createElement('canvas'),lx=lc.getContext('2d');
let W,H,DPR,LS=0.4;                    // capa de luz a 40% de resolución = mucho más rápida
function fit(){
  DPR=Math.min(devicePixelRatio||1,1.6);W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;x.setTransform(DPR,0,0,DPR,0,0);
  lc.width=Math.ceil(W*LS);lc.height=Math.ceil(H*LS);
}
addEventListener('resize',fit);fit();

/* ── sprite de luz: se crea UNA vez y se reutiliza con drawImage ── */
const LSP=document.createElement('canvas');LSP.width=LSP.height=256;
{const c=LSP.getContext('2d'),g=c.createRadialGradient(128,128,0,128,128,128);
 g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.45,'rgba(0,0,0,.92)');
 g.addColorStop(.78,'rgba(0,0,0,.45)');g.addColorStop(1,'rgba(0,0,0,0)');
 c.fillStyle=g;c.fillRect(0,0,256,256)}

/* ── ruido como patrón (una sola vez) ── */
let NPAT;
{const n=document.createElement('canvas');n.width=n.height=128;
 const c=n.getContext('2d'),d=c.createImageData(128,128);
 for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;
  d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=10}
 c.putImageData(d,0,0);NPAT=x.createPattern(n,'repeat')}

/* ── 6 sprites de roca precalculados ── */
const ROCKS=[];
for(let k=0;k<6;k++){
  const S=300,c=document.createElement('canvas');c.width=c.height=S;
  const g=c.getContext('2d'),pts=[],n=10;
  for(let i=0;i<n;i++){const a=i/n*6.283,rr=S*.42*(.6+Math.random()*.55);
    pts.push({x:S/2+Math.cos(a)*rr,y:S/2+Math.sin(a)*rr*.8})}
  g.beginPath();g.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<n;i++)g.lineTo(pts[i].x,pts[i].y);g.closePath();
  const lg=g.createLinearGradient(0,S*.1,0,S*.9);
  lg.addColorStop(0,'#4B5C8E');lg.addColorStop(.55,'#28345C');lg.addColorStop(1,'#141C36');
  g.fillStyle=lg;g.fill();
  g.strokeStyle='rgba(160,190,255,.34)';g.lineWidth=2.4;g.stroke();
  g.save();g.clip();
  for(let v=0;v<4;v++){
    const a=Math.random()*6.283,L=S*(.2+Math.random()*.3);
    g.strokeStyle=`hsla(${160+Math.random()*80},85%,72%,.5)`;g.lineWidth=1+Math.random()*2.4;
    g.beginPath();g.moveTo(S/2,S/2);
    g.quadraticCurveTo(S/2+Math.cos(a)*L*.5-18,S/2+Math.sin(a)*L*.5+16,
                       S/2+Math.cos(a)*L,S/2+Math.sin(a)*L);g.stroke();
  }
  g.restore();ROCKS.push(c);
}

const R=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
function hsh(i,j){const s=Math.sin(i*127.1+j*311.7)*43758.5453;return s-Math.floor(s)}

/* ═══ ESTADO ═══ */
let cam,ceil,depth,best=0,kills,run=false,tk=0,shake=0,tipT=0,
    food,tox,worms,parts,rocks,fx,flares,flareT,bands,
    nemesis=null,nemCnt=0,killer=null,revived,fps=60;

function mkW(p,y,len){return{p,name:p?'TÚ':pick(NAMES),per:p?null:pick(PERS),
  x:p?CFG.W/2:R(140,CFG.W-140),y,ang:1.57,
  len:len||CFG.start,tlen:len||CFG.start,
  path:[],hue:p?188:R(0,360),boost:0,alive:true,tgt:null,th:0}}
const mkF=(a,b)=>({x:R(50,CFG.W-50),y:R(a,b),v:CFG.gain,h:R(150,205),r:3.6});
const mkT=(a,b)=>({x:R(100,CFG.W-100),y:R(a,b),h:pick([92,300]),ph:R(0,6.3)});

function ensureRocks(){
  const b0=Math.floor((cam.y-800)/560),b1=Math.floor((cam.y+H+900)/560);
  for(let b=b0;b<=b1;b++){
    if(bands.has(b)||b<-1)continue;bands.add(b);
    for(let k=0;k<7;k++){
      const h1=hsh(b,k),h2=hsh(b+7,k*3),h3=hsh(b*3,k+5);
      const s=h1<.4?0:(h1<.8?1:2);
      rocks.push({
        sp:ROCKS[Math.floor(h2*6)%6],
        x:s===0?h2*130:(s===1?CFG.W-h2*130:200+h2*(CFG.W-400)),
        y:b*560+h3*560,
        sc:(s===2?.42+h3*.5:.75+h2*.85),
        fx:h1<.5?1:-1
      });
    }
  }
  rocks=rocks.filter(r=>r.y>cam.y-1500&&r.y<cam.y+H+1700);
}

function reset(){
  cam={x:0,y:0};ceil=-H;depth=0;kills=0;flares=2;flareT=0;revived=false;killer=null;
  food=[];tox=[];worms=[];parts=[];rocks=[];fx=[];bands=new Set();
  const p=mkW(true,340);
  for(let i=0;i<p.len*CFG.seg;i++)p.path.push({x:p.x,y:p.y});worms.push(p);
  for(let i=0;i<CFG.bots;i++){
    const b=mkW(false,R(200,1300),CFG.start+R(0,10));
    for(let j=0;j<b.len*CFG.seg;j++)b.path.push({x:b.x,y:b.y});worms.push(b);
  }
  for(let i=0;i<CFG.food;i++)food.push(mkF(0,1700));
  for(let i=0;i<CFG.tox;i++)tox.push(mkT(500,1700));
  ensureRocks();tipT=300;
}
const P=()=>worms[0];

/* ═══ CONTROL ═══ */
let fg=null;
const gf=e=>{const t=e.touches?e.touches[0]:e;fg={x:t.clientX,y:t.clientY}};
cv.addEventListener('pointerdown',e=>{gf(e);cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(fg)gf(e)});
cv.addEventListener('pointerup',()=>fg=null);
cv.addEventListener('pointercancel',()=>fg=null);
document.getElementById('fb').onclick=e=>{e.stopPropagation();
  if(flares<=0||!run)return;flares--;flareT=200;shake=9;upFl()};
const upFl=()=>{document.getElementById('fn').textContent=flares;
  document.getElementById('fb').classList.toggle('off',flares<=0)};

/* ═══ IA ═══ */
function think(b){
  const q=b.per;let vx=0,vy=0,bf=null,bd=1e9;
  for(let i=0;i<food.length;i+=2){const f=food[i];
    const d=(f.x-b.x)**2+(f.y-b.y)**2;if(d<400*400&&d<bd){bd=d;bf=f}}
  if(bf){vx+=(bf.x-b.x)*q.f;vy+=(bf.y-b.y)*q.f}
  for(const w of worms){
    if(w===b||!w.alive)continue;
    const dx=w.x-b.x,dy=w.y-b.y,d=Math.hypot(dx,dy)||1;
    if(d<360){const big=w.len>b.len*1.15,f=(big?-1.2:q.a)*(1-d/360)*320;vx+=dx/d*f;vy+=dy/d*f}
    if(d<300)for(let i=5;i<w.path.length;i+=10){
      const s=w.path[i],ax=s.x-b.x,ay=s.y-b.y,d2=Math.hypot(ax,ay)||1;
      if(d2<110){vx-=ax/d2*(110-d2)*4.5*(1+q.c);vy-=ay/d2*(110-d2)*4.5*(1+q.c)}}
  }
  for(const t of tox){const dx=t.x-b.x,dy=t.y-b.y,d=Math.hypot(dx,dy)||1;
    if(d<160){vx-=dx/d*(160-d)*4;vy-=dy/d*(160-d)*4}}
  if(b.x<160)vx+=(160-b.x)*4;
  if(b.x>CFG.W-160)vx-=(b.x-(CFG.W-160))*4;
  if(b.y-ceil<380)vy+=(380-(b.y-ceil))*3.4;
  vy+=60;
  if(vx||vy)b.tgt=Math.atan2(vy,vx);
  b.boost=(q.a>.6&&bf&&bd<200*200&&Math.random()<.3)?1:0;
}

/* ═══ MUERTE ═══ */
function kill(w,by){
  if(!w.alive)return;w.alive=false;
  // el cuerpo se esparce, pero en porciones pequeñas
  for(let i=0;i<w.path.length;i+=6){const s=w.path[i];
    food.push({x:s.x+R(-14,14),y:s.y+R(-14,14),v:CFG.gainD,h:w.hue,r:5.4})}
  for(let i=0;i<20;i++)parts.push({x:w.x,y:w.y,vx:R(-7,7),vy:R(-7,7),l:1,h:w.hue});
  fx.push({x:w.x,y:w.y,r:0,l:1,h:w.hue});
  if(w.p){killer=by;end()}else if(by&&by.p){kills++;shake=10}
}

/* ═══ LÓGICA (independiente de FPS) ═══ */
function step(dt){
  tk++;const p=P();
  if(flareT>0)flareT-=dt;
  ceil+=(.60+depth*.0022)*dt;

  for(const w of worms){
    if(!w.alive)continue;
    if(w.p){
      if(fg){const dx=fg.x-W/2,dy=fg.y-H/2,d=Math.hypot(dx,dy);
        if(d>10){w.tgt=Math.atan2(dy,dx);w.boost=(d>Math.min(W,H)*.24&&w.len>15)?1:0}
      }else w.boost=0;
    }else if((w.th-=dt)<=0){think(w);w.th=3+Math.random()*3}

    if(w.tgt!=null){let d=((w.tgt-w.ang+Math.PI*3)%6.2832)-Math.PI;
      const a=CFG.turn*(w.p?1:.85)*dt;w.ang+=Math.max(-a,Math.min(a,d))}

    // crecimiento SUAVE hacia el objetivo
    w.len+=(w.tlen-w.len)*CFG.smooth*dt;

    let sp=(w.boost?CFG.boost:CFG.spd)*(1+Math.min(depth*.0004,.5))*dt;
    if(w.boost&&tk%6===0&&w.tlen>15){w.tlen-=.5;
      const t=w.path[w.path.length-1];food.push({x:t.x,y:t.y,v:CFG.gain,h:w.hue,r:3.6})}
    w.x+=Math.cos(w.ang)*sp;w.y+=Math.sin(w.ang)*sp;
    w.x=Math.max(26,Math.min(CFG.W-26,w.x));
    const steps=Math.max(1,Math.round(dt));
    for(let s=0;s<steps;s++)w.path.unshift({x:w.x,y:w.y});
    while(w.path.length>Math.floor(w.len*CFG.seg))w.path.pop();
    if(w.y<ceil)kill(w,null);
  }

  for(const w of worms){
    if(!w.alive)continue;const rr=10+w.len*.10;
    for(let i=food.length-1;i>=0;i--){const f=food[i];
      if(Math.abs(f.y-w.y)>90)continue;
      if((f.x-w.x)**2+(f.y-w.y)**2<(rr+f.r+10)**2){
        w.tlen+=f.v;food.splice(i,1);
        if(w.p)parts.push({x:f.x,y:f.y,vx:R(-2,2),vy:R(-2,2),l:.55,h:f.h})}}
    for(const t of tox)if((t.x-w.x)**2+(t.y-w.y)**2<(rr+14)**2)kill(w,null);
  }
  for(const w of worms){
    if(!w.alive)continue;const rw=9+w.len*.10;
    for(const o of worms){
      if(o===w||!o.alive)continue;
      if(Math.abs(o.y-w.y)>600)continue;
      const ro=9+o.len*.10;
      for(let i=4;i<o.path.length;i+=3){const s=o.path[i];
        if((s.x-w.x)**2+(s.y-w.y)**2<(rw+ro*.8)**2){kill(w,o);break}}
      if(!w.alive)break;
    }
  }

  const low=cam.y+H+900;
  while(food.length<CFG.food)food.push(mkF(cam.y+H,low));
  food=food.filter(f=>f.y>ceil-300);
  while(tox.length<CFG.tox)tox.push(mkT(cam.y+H+250,low));
  tox=tox.filter(t=>t.y>ceil-300);
  const live=worms.filter(w=>w.alive&&!w.p).length;
  if(live<CFG.bots&&tk%26===0){
    const b=mkW(false,cam.y+H+R(250,700),CFG.start+R(0,8));
    for(let j=0;j<b.len*CFG.seg;j++)b.path.push({x:b.x,y:b.y});worms.push(b)}
  worms=worms.filter(w=>w.p||w.alive);

  if(p.alive){depth=Math.max(depth,Math.floor(p.y/10));
    cam.y+=((p.y-H*.42)-cam.y)*.14*dt;
    cam.x+=((p.x-W/2)-cam.x)*.14*dt;
    cam.x=Math.max(-30,Math.min(CFG.W-W+30,cam.x))}
  ensureRocks();

  for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.95;q.vy*=.95;q.l-=.022*dt}
  parts=parts.filter(q=>q.l>0);
  for(const g of fx){g.r+=11*dt;g.l-=.032*dt}fx=fx.filter(g=>g.l>0);

  document.getElementById('dep').textContent=depth;
  const dz=(p.y-ceil)/H;
  document.getElementById('warn').style.opacity=p.alive&&dz<.38?(1-dz/.38).toFixed(2):0;
  if(tipT>0&&(tipT-=dt)<=0)document.getElementById('tip').style.opacity=0;
  if(tk%12===0)board();
}
function board(){
  const a=worms.filter(w=>w.alive).sort((m,n)=>n.len-m.len).slice(0,6);
  document.getElementById('lbb').innerHTML=a.map((w,i)=>
   `<div class="r ${w.p?'me':(w.name===nemesis?'nm':'')}"><i>${i+1}</i><b>${w.name}</b>${Math.floor(w.len)}</div>`).join('');
}

/* ═══ DIBUJO ═══ */
function render(){
  const p=P();
  x.save();
  if(shake>.4){x.translate(R(-shake,shake),R(-shake,shake));shake*=.86}
  x.translate(-cam.x,-cam.y);

  // roca de fondo
  x.fillStyle='#0E1530';x.fillRect(cam.x-20,cam.y-20,W+40,H+40);
  const gy=Math.floor((cam.y-160)/120)*120;
  for(let yy=gy;yy<cam.y+H+140;yy+=120){
    for(let xx=0;xx<CFG.W;xx+=120){
      const s=hsh(xx*.013,yy*.013);
      x.fillStyle=`rgba(${30+s*30},${42+s*38},${80+s*52},.5)`;
      x.beginPath();x.arc(xx+s*90,yy+s*90,26+s*52,0,6.29);x.fill();
    }
  }
  // formaciones (sprites precalculados, sólo drawImage)
  for(const r of rocks){
    if(r.y<cam.y-460||r.y>cam.y+H+460)continue;
    const s=300*r.sc;
    x.save();x.translate(r.x,r.y);x.scale(r.fx*r.sc,r.sc);
    x.drawImage(r.sp,-150,-150);x.restore();
  }
  // paredes
  x.fillStyle='rgba(70,92,150,.55)';
  x.fillRect(0,cam.y-40,60,H+80);x.fillRect(CFG.W-60,cam.y-40,60,H+80);

  // gusanos
  x.globalCompositeOperation='lighter';
  for(const w of worms){
    if(!w.alive)continue;
    const r0=9+w.len*.10;
    x.shadowBlur=w.boost?22:12;x.shadowColor=`hsl(${w.hue},100%,60%)`;
    for(let i=w.path.length-1;i>=0;i-=3){
      const s=w.path[i];
      if(s.y<cam.y-90||s.y>cam.y+H+90)continue;
      const f=i/w.path.length;
      x.fillStyle=`hsla(${(w.hue+f*55)%360},100%,${72-f*24}%,.95)`;
      x.beginPath();x.arc(s.x,s.y,r0*(1-f*.38),0,6.29);x.fill();
    }
    x.shadowBlur=26;x.fillStyle=`hsl(${w.hue},100%,84%)`;
    x.beginPath();x.arc(w.x,w.y,r0*1.1,0,6.29);x.fill();
  }
  x.shadowBlur=0;x.globalCompositeOperation='source-over';
  for(const w of worms){
    if(!w.alive)continue;const r0=9+w.len*.10;
    x.fillStyle='#060A16';
    for(const o of[-.55,.55]){x.beginPath();
      x.arc(w.x+Math.cos(w.ang+o)*r0*.58,w.y+Math.sin(w.ang+o)*r0*.58,r0*.2,0,6.29);x.fill()}
  }
  x.restore();

  /* ── OSCURIDAD: sprite reutilizado, capa a baja resolución ── */
  lx.setTransform(1,0,0,1,0,0);
  lx.globalCompositeOperation='source-over';
  lx.fillStyle=`rgba(3,5,12,${1-CFG.amb})`;lx.fillRect(0,0,lc.width,lc.height);
  lx.globalCompositeOperation='destination-out';
  const fl=flareT>0?Math.min(flareT/30,1):0;
  for(const w of worms){
    if(!w.alive)continue;
    const sx=(w.x-cam.x)*LS,sy=(w.y-cam.y)*LS;
    if(sx<-600||sx>lc.width+600||sy<-600||sy>lc.height+600)continue;
    let rad=(CFG.light+w.len*CFG.lper)*LS;
    if(w.p&&fl)rad+=fl*Math.max(lc.width,lc.height)*1.5;
    lx.drawImage(LSP,sx-rad,sy-rad,rad*2,rad*2);
    for(let i=10;i<w.path.length;i+=16){
      const s=w.path[i],px=(s.x-cam.x)*LS,py=(s.y-cam.y)*LS,rr=rad*.34;
      lx.drawImage(LSP,px-rr,py-rr,rr*2,rr*2);
    }
  }
  lx.globalCompositeOperation='source-over';
  x.imageSmoothingEnabled=true;
  x.drawImage(lc,0,0,W,H);

  /* ── brilla, no ilumina ── */
  x.save();x.translate(-cam.x,-cam.y);x.globalCompositeOperation='lighter';
  x.shadowBlur=10;
  for(const f of food){
    if(f.y<cam.y-40||f.y>cam.y+H+40)continue;
    x.shadowColor=`hsl(${f.h},100%,60%)`;
    x.fillStyle=`hsla(${f.h},100%,${f.v>CFG.gain?80:66}%,${f.v>CFG.gain?1:.72})`;
    x.beginPath();x.arc(f.x,f.y,f.r,0,6.29);x.fill();
  }
  for(const t of tox){
    if(t.y<cam.y-70||t.y>cam.y+H+70)continue;
    const pl=.5+Math.sin(tk*.2+t.ph)*.5;
    x.shadowBlur=22;x.shadowColor=`hsl(${t.h},100%,54%)`;
    x.fillStyle=`hsla(${t.h},100%,${52+pl*16}%,${.6+pl*.4})`;
    x.beginPath();x.arc(t.x,t.y,12+pl*3,0,6.29);x.fill();
  }
  x.shadowBlur=0;
  for(const q of parts){x.fillStyle=`hsla(${q.h},100%,72%,${q.l})`;x.fillRect(q.x,q.y,3.6,3.6)}
  for(const g of fx){x.strokeStyle=`hsla(${g.h},100%,72%,${g.l*.6})`;x.lineWidth=3.2;
    x.beginPath();x.arc(g.x,g.y,g.r,0,6.29);x.stroke()}
  x.globalCompositeOperation='source-over';

  x.font='600 11px Outfit';x.textAlign='center';
  for(const w of worms){
    if(!w.alive||w.p)continue;
    const d=Math.hypot(w.x-p.x,w.y-p.y);
    if(d<420){const al=1-d/420,n=w.name===nemesis;
      x.fillStyle=n?`rgba(255,80,110,${al})`:`rgba(237,242,255,${al*.6})`;
      x.fillText(w.name,w.x,w.y-(18+w.len*.11));
      if(n){x.strokeStyle=`rgba(255,60,100,${al*.6})`;x.lineWidth=2.2;
        x.beginPath();x.arc(w.x,w.y,22+w.len*.12,0,6.29);x.stroke()}}
  }
  x.textAlign='left';
  const cy=ceil-cam.y;
  if(cy>-200){
    x.fillStyle='#020308';x.fillRect(cam.x-20,cy-900,W+40,900);
    x.fillStyle='rgba(180,20,60,.30)';x.fillRect(cam.x-20,cy-14,W+40,16);
  }
  x.restore();

  x.fillStyle=NPAT;x.globalAlpha=.5;x.fillRect(0,0,W,H);x.globalAlpha=1;
}

/* ═══ BUCLE con delta-time ═══ */
let last=performance.now(),acc=0,frames=0;
function loop(now){
  let dt=(now-last)/16.667;last=now;
  dt=Math.max(.4,Math.min(dt,2.6));
  acc+=now;frames++;
  if(frames>=20){fps=Math.round(1000/((now-acc/frames)/frames)||60);frames=0;acc=0}
  if(run)step(dt);
  render();
  requestAnimationFrame(loop);
}

/* ═══ PANTALLAS ═══ */
const veil=document.getElementById('veil');
function end(){
  run=false;best=Math.max(best,depth);
  if(killer){if(nemesis===killer.name)nemCnt++;else{nemesis=killer.name;nemCnt=1}}
  document.getElementById('di').style.display=killer?'block':'none';
  document.getElementById('who').textContent=killer?killer.name:'';
  document.getElementById('fd').textContent=depth;
  document.getElementById('fl').textContent='METROS DE PROFUNDIDAD';
  document.getElementById('fs').style.display='flex';
  document.getElementById('flen').textContent=Math.floor(P().len);
  document.getElementById('fbest').textContent=best;
  document.getElementById('fk').textContent=kills;
  document.getElementById('bRev').style.display=revived?'none':'block';
  document.getElementById('bGo').textContent='NUEVO DESCENSO';
  if(nemesis){document.getElementById('nb').style.display='block';
    document.getElementById('nn').textContent=nemesis;
    document.getElementById('nc').textContent=nemCnt+(nemCnt>1?' muertes':' muerte')}
  veil.classList.add('on');
}
document.getElementById('bGo').onclick=()=>{reset();upFl();board();
  document.getElementById('tip').style.opacity=1;veil.classList.remove('on');
  last=performance.now();run=true};
document.getElementById('bRev').onclick=()=>{
  revived=true;const p=P();p.alive=true;
  p.tlen=Math.max(CFG.start,p.tlen*.7);p.len=p.tlen;
  p.y=Math.max(p.y,ceil+H*.6);p.path=[];
  for(let i=0;i<p.len*CFG.seg;i++)p.path.push({x:p.x,y:p.y});
  for(const w of worms)if(!w.p&&w.alive&&Math.hypot(w.x-p.x,w.y-p.y)<280)kill(w,null);
  flares=Math.max(flares,1);flareT=180;upFl();
  veil.classList.remove('on');last=performance.now();run=true;
};
reset();upFl();board();requestAnimationFrame(loop);
</script>
